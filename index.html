    // 기본값(일별) 표시 활성화
    subcatStatsViewButtons.forEach(function (btn) {
      btn.classList.toggle("active", btn.dataset.value === subcatStatsViewMode);
    });


    // 기본값(일별) 표시 활성화
    statsViewButtons.forEach(function (btn) {
      btn.classList.toggle("active", btn.dataset.value === statsViewMode);
    });

    function cycleScheduleStatus(index) {
      schedule[index].status = nextScheduleStatus(schedule[index].status);
      saveScheduleFor(selectedDate, schedule);
      renderSchedule();
    }

    // index 뒤에 휴식 블록을 진짜 일정 항목으로 끼워 넣음 (schedule 배열의 정식 항목)
    // 그래야 "정렬" 버튼이나 나중에 만들 "하루 휴식 총량 보기" 기능에서 다른 일정들과 똑같이 다뤄짐
    function insertRestBlock(index) {
      const item = schedule[index];
      const next = schedule[index + 1];
      const boundary = next
        ? timeToExtendedMinutes(next.time)
        : nextHourBoundary(timeToExtendedMinutes(item.time));
      const restTime = extendedMinutesToTime(boundary - 10);

      schedule.splice(index + 1, 0, {
        time: restTime,
        text: "휴식",
        status: "done",
        category: "",
        subcategory: "",
        isRest: true
      });

      saveScheduleFor(selectedDate, schedule);
      renderSchedule();
    }

    function updateRestTime(index, timeStr) {
      schedule[index].time = timeStr;
      saveScheduleFor(selectedDate, schedule);
      renderSchedule();
    }

    function removeRestBlock(index) {
      schedule.splice(index, 1);
      saveScheduleFor(selectedDate, schedule);
      renderSchedule();
    }

    function deleteSchedule(index) {
      const dateAtDeletion = new Date(selectedDate);
      // 되돌리기용으로 삭제 직전 전체 상태를 통째로 복사해둠
      const beforeState = JSON.parse(JSON.stringify(schedule));

      // 해당 시간대 박스(시간 + 내용) 자체를 통째로 삭제. 다른 칸들의 시간은 안 건드림
      schedule.splice(index, 1);

      saveScheduleFor(selectedDate, schedule);
      renderSchedule();
      renderWeek();

      showUndoToast("일정을 삭제했어요.", function () {
        saveScheduleFor(dateAtDeletion, beforeState);
        if (isSameDate(dateAtDeletion, selectedDate)) {
          schedule = beforeState;
          renderSchedule();
        }
        renderWeek();
      });
    }

    scheduleAddTrigger.addEventListener("click", function () {
      const newTime = schedule.length === 0 ? "" : nextTimeLabel(schedule[schedule.length - 1].time);
      schedule.push({ time: newTime, text: "", status: "todo", category: "", subcategory: "" });
      saveScheduleFor(selectedDate, schedule);
      renderSchedule();
      renderWeek();
      const taskInputs = scheduleList.querySelectorAll(".task-input");
      taskInputs[taskInputs.length - 1].focus();
    });

    const scheduleResetBtn = document.getElementById("schedule-reset-btn");
    scheduleResetBtn.addEventListener("click", function () {
      if (scheduleResetBtn.classList.contains("confirm")) {
        schedule = generateDefaultSchedule();
        saveScheduleFor(selectedDate, schedule);
        renderSchedule();
        renderWeek();
        scheduleResetBtn.classList.remove("confirm");
        scheduleResetBtn.textContent = "초기화";
        return;
      }
      scheduleResetBtn.classList.add("confirm");
      scheduleResetBtn.textContent = "확인?";
      setTimeout(function () {
        scheduleResetBtn.classList.remove("confirm");
        scheduleResetBtn.textContent = "초기화";
      }, 2500);
    });

    const scheduleSortBtn = document.getElementById("schedule-sort-btn");
    scheduleSortBtn.addEventListener("click", function () {
      schedule.sort(function (a, b) {
        return scheduleSortKey(a.time).localeCompare(scheduleSortKey(b.time));
      });
      saveScheduleFor(selectedDate, schedule);
      renderSchedule();
    });

    renderWeek();
    loadAndRenderSchedule();

    // ---- 습관 · 스트릭 ----
    const habitList = document.getElementById("habit-list");
    const habitAddTrigger = document.getElementById("habit-add-trigger");

    // 새 습관을 추가할 때 이 배열을 순서대로 돌려가며 자동으로 색을 배정함
    const habitColorPalette = ["#3b6fd6", "#3f9142", "#c0862a", "#a1477a", "#3a8f8f", "#8a5fd6"];
    // 학습 자료는 습관보다 차분한 파스텔 톤으로 구분
    const materialColorPalette = ["#8FBCBB", "#88C0D0", "#81A1C1", "#7195B5", "#6389A9"];

    // ---- 삭제된 습관 휴지통 (시간 제한 없이 복구 가능) ----
    const habitTrashList = document.getElementById("habit-trash-list");

    function loadHabitTrash() {
      return JSON.parse(localStorage.getItem("habitsTrash")) || [];
    }

    function saveHabitTrash(trash) {
      localStorage.setItem("habitsTrash", JSON.stringify(trash));
    }

    function renderHabitTrash() {
      const trash = loadHabitTrash();
      habitTrashList.innerHTML = "";

      if (trash.length === 0) {
        const empty = document.createElement("div");
        empty.className = "setting-hint";
        empty.textContent = "삭제된 습관이 없어요.";
        habitTrashList.appendChild(empty);
        return;
      }

      trash.forEach(function (entry, trashIndex) {
        const row = document.createElement("div");
        row.className = "trash-row";

        const swatch = document.createElement("div");
        swatch.className = "swatch";
        swatch.style.background = entry.habit.color;

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = entry.habit.name === "" ? "(이름 없음)" : entry.habit.name;

        const restoreBtn = document.createElement("button");
        restoreBtn.textContent = "복구";
        restoreBtn.addEventListener("click", function () {
          habits.push(entry.habit);
          saveHabits();
          renderHabits();

          const remaining = loadHabitTrash().filter(function (t) {
            return t.deletedAt !== entry.deletedAt;
          });
          saveHabitTrash(remaining);
          renderHabitTrash();
        });

        const purgeBtn = document.createElement("button");
        purgeBtn.textContent = "완전 삭제";
        purgeBtn.addEventListener("click", function () {
          if (purgeBtn.classList.contains("confirm")) {
            const remaining = loadHabitTrash().filter(function (t) {
              return t.deletedAt !== entry.deletedAt;
            });
            saveHabitTrash(remaining);
            renderHabitTrash();
            return;
          }
          purgeBtn.classList.add("confirm");
          purgeBtn.textContent = "정말 삭제?";
          setTimeout(function () {
            purgeBtn.classList.remove("confirm");
            purgeBtn.textContent = "완전 삭제";
          }, 2500);
        });

        row.appendChild(swatch);
        row.appendChild(name);
        row.appendChild(restoreBtn);
        row.appendChild(purgeBtn);
        habitTrashList.appendChild(row);
      });
    }

    let habits = JSON.parse(localStorage.getItem("habits")) || [];

    function saveHabits() {
      localStorage.setItem("habits", JSON.stringify(habits));
    }

    // 오늘(또는 오늘 아직 안했으면 어제)부터 거꾸로 훑으면서 끊기지 않은 날짜 수를 셈
    // ---- 습관 기록 보기 모달 (습관을 누르면 그 아래로 펼쳐지는 아코디언 방식) ----
    const habitHistoryBtn = document.getElementById("habit-history-btn");
    const habitHistoryOverlay = document.getElementById("habit-history-overlay");
    const habitHistoryClose = document.getElementById("habit-history-close");
    const habitHistoryList = document.getElementById("habit-history-list");

    habitHistoryBtn.addEventListener("click", function () {
      renderHabitHistoryList();
      habitHistoryOverlay.classList.add("visible");
    });

    habitHistoryClose.addEventListener("click", function () {
      habitHistoryOverlay.classList.remove("visible");
    });

    habitHistoryOverlay.addEventListener("click", function (event) {
      if (event.target === habitHistoryOverlay) {
        habitHistoryOverlay.classList.remove("visible");
      }
    });

    // 특정 연/월 하나짜리 미니 히트맵을 만듦 (펼친 습관 아래에 여러 달을 쌓아 보여줄 때 사용)
    function buildMonthHeatmap(habit, year, month) {
      const wrap = document.createElement("div");

      const label = document.createElement("div");
      label.className = "setting-hint";
      label.style.marginBottom = "6px";
      label.textContent = year + "년 " + (month + 1) + "월";

      const grid = document.createElement("div");
      grid.className = "habit-heatmap";
      grid.style.flex = "none";

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      for (let d = 1; d <= daysInMonth; d++) {
        const cellDate = new Date(year, month, d);
        const cell = document.createElement("div");
        cell.className = "heatmap-cell";
        if (habit.completedDates.indexOf(formatDateKey(cellDate)) !== -1) {
          cell.style.background = habit.color;
        }
        grid.appendChild(cell);
      }

      wrap.appendChild(label);
      wrap.appendChild(grid);
      return wrap;
    }

    // 습관 하나의 시작 이후 모든 달을 최신순으로 쌓아서 컨테이너에 채워 넣음
    function fillHabitMonths(container, habit) {
      container.innerHTML = "";

      let cursorYear = today.getFullYear();
      let cursorMonth = today.getMonth();

      let earliestYear = cursorYear;
      let earliestMonth = cursorMonth;
      if (habit.completedDates.length > 0) {
        const earliestKey = habit.completedDates.slice().sort()[0];
        const parts = earliestKey.split("-");
        earliestYear = parseInt(parts[0], 10);
        earliestMonth = parseInt(parts[1], 10) - 1;
      }

      while (cursorYear > earliestYear || (cursorYear === earliestYear && cursorMonth >= earliestMonth)) {
        container.appendChild(buildMonthHeatmap(habit, cursorYear, cursorMonth));
        cursorMonth--;
        if (cursorMonth < 0) {
          cursorMonth = 11;
          cursorYear--;
        }
      }
    }

    // 습관들을 쭉 나열하고, 각 습관을 누르면 그 아래로 펼쳐지는 아코디언 목록을 만듦
    function renderHabitHistoryList() {
      habitHistoryList.innerHTML = "";

      if (habits.length === 0) {
        const empty = document.createElement("div");
        empty.className = "setting-hint";
        empty.textContent = "습관을 먼저 추가해주세요.";
        habitHistoryList.appendChild(empty);
        return;
      }

      habits.forEach(function (habit) {
        const item = document.createElement("div");
        item.className = "habit-history-item";

        const header = document.createElement("div");
        header.className = "habit-history-item-header";

        const dot = document.createElement("span");
        dot.className = "habit-history-dot";
        dot.style.background = habit.color;

        const name = document.createElement("span");
        name.className = "habit-history-name";
        name.textContent = habit.name;

        const count = document.createElement("span");
        count.className = "habit-history-count";
        count.textContent = "총 " + habit.completedDates.length + "일";

        const arrow = document.createElement("span");
        arrow.className = "habit-history-arrow";
        arrow.textContent = "▶";

        header.appendChild(dot);
        header.appendChild(name);
        header.appendChild(count);
        header.appendChild(arrow);

        const body = document.createElement("div");
        body.className = "habit-history-item-body";
        let loaded = false;

        header.addEventListener("click", function () {
          const willOpen = !item.classList.contains("open");
          item.classList.toggle("open", willOpen);
          // 처음 펼칠 때만 그 습관의 월별 기록을 채워 넣음 (매번 다시 그릴 필요 없게)
          if (willOpen && !loaded) {
            fillHabitMonths(body, habit);
            loaded = true;
          }
        });

        item.appendChild(header);
        item.appendChild(body);
        habitHistoryList.appendChild(item);
      });
    }

    function calculateHabitStreak(habit) {
      let cursor = new Date(today);
      if (habit.completedDates.indexOf(formatDateKey(cursor)) === -1) {
        cursor = addDays(cursor, -1);
      }
      let streak = 0;
      while (habit.completedDates.indexOf(formatDateKey(cursor)) !== -1) {
        streak++;
        cursor = addDays(cursor, -1);
      }
      return streak;
    }

    function toggleHabitToday(index) {
      const key = formatDateKey(today);
      const pos = habits[index].completedDates.indexOf(key);
      if (pos === -1) {
        habits[index].completedDates.push(key);
      } else {
        habits[index].completedDates.splice(pos, 1);
      }
      saveHabits();
      renderHabits();
    }

    let draggedHabitIndex = null;

    function renderHabits() {
      habitList.innerHTML = "";

      habits.forEach(function (habit, index) {
        const card = document.createElement("div");
        card.className = "habit-card";

        card.addEventListener("dragover", function (event) {
          event.preventDefault();
          card.classList.add("drag-over");
        });

        card.addEventListener("dragleave", function () {
          card.classList.remove("drag-over");
        });

        card.addEventListener("drop", function (event) {
          event.preventDefault();
          card.classList.remove("drag-over");
          if (draggedHabitIndex === null || draggedHabitIndex === index) return;

          const moved = habits[draggedHabitIndex];
          habits.splice(draggedHabitIndex, 1);
          habits.splice(index, 0, moved);
          draggedHabitIndex = null;
          saveHabits();
          renderHabits();
        });

        // ---- 상단: 드래그 손잡이 + 체크박스 + 이름 + 삭제 ----
        const header = document.createElement("div");
        header.className = "habit-header";

        const dragHandle = document.createElement("span");
        dragHandle.className = "drag-handle";
        dragHandle.textContent = "⠿";
        dragHandle.draggable = true;
        dragHandle.addEventListener("dragstart", function (event) {
          draggedHabitIndex = index;
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setDragImage(card, 10, 10);
        });
        header.appendChild(dragHandle);

        const checkbox = document.createElement("div");
        checkbox.className = "habit-checkbox";
        const doneToday = habit.completedDates.indexOf(formatDateKey(today)) !== -1;
        if (doneToday) {
          checkbox.style.background = habit.color;
          checkbox.style.borderColor = habit.color;
          checkbox.textContent = "✓";
        }
        checkbox.addEventListener("click", function () {
          toggleHabitToday(index);
        });

        const name = document.createElement("input");
        name.className = "habit-name";
        name.placeholder = "습관 이름";
        name.value = habit.name;
        if (doneToday) {
          name.style.textDecoration = "line-through";
          name.style.opacity = "0.4";
        }
        name.addEventListener("change", function () {
          habits[index].name = name.value;
          saveHabits();
        });

        const removeBtn = document.createElement("span");
        removeBtn.className = "habit-remove";
        removeBtn.textContent = "×";
        removeBtn.addEventListener("click", function () {
          if (removeBtn.classList.contains("confirm")) {
            const removedHabit = habits[index];
            const deletedAt = Date.now();

            habits.splice(index, 1);
            saveHabits();
            renderHabits();

            const trash = loadHabitTrash();
            trash.push({ habit: removedHabit, deletedAt: deletedAt });
            saveHabitTrash(trash);
            renderHabitTrash();

            showUndoToast("습관을 삭제했어요.", function () {
              habits.splice(index, 0, removedHabit);
              saveHabits();
              renderHabits();

              const remaining = loadHabitTrash().filter(function (t) {
                return t.deletedAt !== deletedAt;
              });
              saveHabitTrash(remaining);
              renderHabitTrash();
            });
            return;
          }
          removeBtn.classList.add("confirm");
          removeBtn.textContent = "삭제?";
          setTimeout(function () {
            removeBtn.classList.remove("confirm");
            removeBtn.textContent = "×";
          }, 2500);
        });

        header.appendChild(checkbox);
        header.appendChild(name);
        header.appendChild(removeBtn);

        // ---- 하단: 히트맵 + 연속 일수 ----
        const body = document.createElement("div");
        body.className = "habit-body";

        const heatmap = document.createElement("div");
        heatmap.className = "habit-heatmap";

        const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
        for (let d = 1; d <= daysInMonth; d++) {
          const cellDate = new Date(today.getFullYear(), today.getMonth(), d);
          const cell = document.createElement("div");
          cell.className = "heatmap-cell";
          if (habit.completedDates.indexOf(formatDateKey(cellDate)) !== -1) {
            cell.style.background = habit.color;
          }
          heatmap.appendChild(cell);
        }

        const streak = document.createElement("div");
        streak.className = "habit-streak";

        const streakNumber = document.createElement("div");
        streakNumber.className = "streak-number";
        streakNumber.textContent = calculateHabitStreak(habit);
        streakNumber.style.color = habit.color;

        const streakLabel = document.createElement("div");
        streakLabel.className = "streak-label";
        streakLabel.textContent = "일 연속";

        streak.appendChild(streakNumber);
        streak.appendChild(streakLabel);

        body.appendChild(heatmap);
        body.appendChild(streak);

        card.appendChild(header);
        card.appendChild(body);
        habitList.appendChild(card);
      });
    }

    habitAddTrigger.addEventListener("click", function () {
      const color = habitColorPalette[habits.length % habitColorPalette.length];
      habits.push({ name: "", color: color, completedDates: [] });
      saveHabits();
      renderHabits();

      nameInputs[nameInputs.length - 1].focus();

    renderHabits();
    renderHabitTrash();

    // ---- 학습 진행률 ----
    const materialsList = document.getElementById("materials-list");
    const materialAddTrigger = document.getElementById("material-add-trigger");

    materialAddTrigger.addEventListener("click", function () {
      const color = materialColorPalette[materials.length % materialColorPalette.length];
      materials.push({ title: "", totalPages: 0, currentPage: 0, dailyLog: {}, unit: "쪽", color: color });
      saveMaterials();
      renderMaterials();
      const titleInputs = materialsList.querySelectorAll(".material-title");
      titleInputs[titleInputs.length - 1].focus();
    });

    let materials = JSON.parse(localStorage.getItem("materials")) || [];

    function saveMaterials() {
      localStorage.setItem("materials", JSON.stringify(materials));
    }

    // 평균이 아니라, "가장 최근에 실제로 기록이 있었던 날"의 양을 기본값으로 삼음
    // (어제 기록이 없으면 그 전날, 또 없으면 더 전날... 이렇게 거슬러 올라가서 찾음)
    function getLastLoggedAmount(dailyLog) {
      const dates = Object.keys(dailyLog || {}).sort(); // 오름차순(과거→최근)
      for (let i = dates.length - 1; i >= 0; i--) {
        if (dailyLog[dates[i]] > 0) return dailyLog[dates[i]];
      }
      return 0;
    }

    // "하루에 N개씩 하면" 입력칸 + 계산 결과를 만들어서 pace row에 채워 넣음.
    // 입력값은 저장하지 않아서, 다시 열면 항상 기본값(마지막 기록일 기준)으로 리셋됨
    function renderPaceEstimate(paceRow, dailyLog, remaining, unit, totalPages) {
      paceRow.innerHTML = "";

      if (totalPages > 0 && remaining === 0) {
        paceRow.textContent = "완독했어요 🎉";
        return;
      }

      const defaultPace = getLastLoggedAmount(dailyLog);

      const prefixLabel = document.createElement("span");
      prefixLabel.textContent = "하루에";

      const paceInput = document.createElement("input");
      paceInput.type = "number";
      paceInput.className = "material-pace-input";
      paceInput.min = "0";
      paceInput.value = defaultPace;

      const suffixLabel = document.createElement("span");
      suffixLabel.textContent = unit + "씩 하면";

      const resultLabel = document.createElement("span");

      function updateResult() {
        let val = parseInt(paceInput.value, 10);
        if (isNaN(val) || val < 0) val = 0;
        if (val === 0) {
          resultLabel.textContent = "기록을 남기면(또는 위 칸에 값을 입력하면) 완독 예상일을 알려드려요";
          return;
        }
        const daysLeft = Math.ceil(remaining / val);
        const finishDate = addDays(today, daysLeft);
        const yy = String(finishDate.getFullYear()).slice(2);
        resultLabel.innerHTML =
          "<b>" + daysLeft + "일</b> 뒤인 <b>" + yy + "년 " + (finishDate.getMonth() + 1) + "월 " + finishDate.getDate() + "일</b>에 완료";
      }

      paceInput.addEventListener("input", updateResult);
      updateResult();

      paceRow.appendChild(prefixLabel);
      paceRow.appendChild(paceInput);
      paceRow.appendChild(suffixLabel);
      paceRow.appendChild(resultLabel);
    }

    function renderMaterials() {
      materialsList.innerHTML = "";
      const todayKey = formatDateKey(today);

      materials.forEach(function (material, index) {
        const unit = material.unit || "쪽";
        // 기존에 저장된 자료(색이 없던 것들)는 자동으로 색을 하나 배정
        const color = material.color || materialColorPalette[index % materialColorPalette.length];

        const item = document.createElement("div");
        item.className = "material-item";

        const header = document.createElement("div");
        header.className = "material-header";

        const title = document.createElement("input");
        title.className = "material-title";
        title.placeholder = "자료 이름";
        title.value = material.title;
        title.addEventListener("change", function () {
          materials[index].title = title.value;
          saveMaterials();
        });

        const removeBtn = document.createElement("span");
        removeBtn.className = "material-remove";
        removeBtn.textContent = "×";
        removeBtn.addEventListener("click", function () {
          if (removeBtn.classList.contains("confirm")) {
            const removedIndex = index;
            const removedMaterial = materials[removedIndex];

            materials.splice(removedIndex, 1);
            saveMaterials();
            renderMaterials();

            showUndoToast("학습 자료를 삭제했어요.", function () {
              materials.splice(removedIndex, 0, removedMaterial);
              saveMaterials();
              renderMaterials();
            });
            return;
          }
          removeBtn.classList.add("confirm");
          removeBtn.textContent = "삭제?";
          setTimeout(function () {
            removeBtn.classList.remove("confirm");
            removeBtn.textContent = "×";
          }, 2500);
        });

        header.appendChild(title);
        header.appendChild(removeBtn);

        const totalRow = document.createElement("div");
        totalRow.className = "material-total-row";
        const totalLabel = document.createElement("span");
        totalLabel.textContent = "총";
        const totalInput = document.createElement("input");
        totalInput.type = "number";
        totalInput.className = "material-total-input";
        totalInput.min = "0";
        totalInput.value = material.totalPages || 0;
        totalInput.addEventListener("change", function () {
          let val = parseInt(totalInput.value, 10);
          if (isNaN(val) || val < 0) val = 0;
          materials[index].totalPages = val;
          saveMaterials();
          renderMaterials();
        });
        const unitInput = document.createElement("input");
        unitInput.type = "text";
        unitInput.className = "material-unit-input";
        unitInput.value = unit;
        unitInput.placeholder = "쪽";
        unitInput.addEventListener("change", function () {
          materials[index].unit = unitInput.value === "" ? "쪽" : unitInput.value;
          saveMaterials();
          renderMaterials();
        });
        totalRow.appendChild(totalLabel);
        totalRow.appendChild(totalInput);
        totalRow.appendChild(unitInput);

        const track = document.createElement("div");
        track.className = "material-progress-track";
        const fill = document.createElement("div");
        fill.className = "material-progress-fill";
        fill.style.background = color;
        const percent = material.totalPages > 0
          ? Math.min(100, Math.round(material.currentPage / material.totalPages * 100))
          : 0;
        fill.style.width = percent + "%";
        track.appendChild(fill);

        const remaining = Math.max(0, material.totalPages - material.currentPage);

        const statsRow = document.createElement("div");
        statsRow.className = "material-stats-row";

        const leftStat = document.createElement("span");
        leftStat.className = "material-current-wrap";

        const currentInput = document.createElement("input");
        currentInput.type = "number";
        currentInput.className = "material-current-input";
        currentInput.min = "0";
        currentInput.value = material.currentPage;
        currentInput.addEventListener("change", function () {
          let val = parseInt(currentInput.value, 10);
          if (isNaN(val) || val < 0) val = 0;
          if (val > material.totalPages) val = material.totalPages;
          materials[index].currentPage = val;
          saveMaterials();
          renderMaterials();
        });

        const leftText = document.createElement("span");
        leftText.textContent = " / " + material.totalPages + unit + " · " + percent + "%";

        leftStat.appendChild(currentInput);
        leftStat.appendChild(leftText);

        const rightStat = document.createElement("span");
        rightStat.textContent = remaining + unit + " 남음";
        statsRow.appendChild(leftStat);
        statsRow.appendChild(rightStat);

        const paceRow = document.createElement("div");
        paceRow.className = "material-pace-row";
        renderPaceEstimate(paceRow, material.dailyLog, remaining, unit, material.totalPages);

        const logRow = document.createElement("div");
        logRow.className = "material-log-row";

        const logLabel = document.createElement("span");
        logLabel.textContent = "오늘";

        const logInput = document.createElement("input");
        logInput.type = "number";
        logInput.className = "material-log-input";
        logInput.min = "0";
        logInput.placeholder = "0";
        // 이 칸은 "오늘 읽은 총량"이 아니라 "지금 추가로 읽은 양"을 입력하는 칸
        logInput.value = "";

        const logSuffix = document.createElement("span");
        logSuffix.textContent = unit;

        const logBtn = document.createElement("button");
        logBtn.className = "material-log-btn";
        logBtn.textContent = "기록";
        logBtn.style.background = color + "30"; // 약 19% 불투명도
        logBtn.style.color = color;
        logBtn.addEventListener("click", function () {
          const val = parseInt(logInput.value, 10);
          if (isNaN(val) || val <= 0) return;
          if (!material.dailyLog) material.dailyLog = {};
          const prevLogged = material.dailyLog[todayKey] || 0;
          material.dailyLog[todayKey] = prevLogged + val;
          material.currentPage = Math.max(0, Math.min(material.totalPages, material.currentPage + val));
          saveMaterials();
          renderMaterials();
        });

        const todayLoggedTotal = (material.dailyLog && material.dailyLog[todayKey]) || 0;

        const logTotalWrap = document.createElement("span");
        logTotalWrap.className = "setting-hint";
        logTotalWrap.style.display = "inline-flex";
        logTotalWrap.style.alignItems = "center";
        logTotalWrap.style.gap = "3px";

        const logTotalPrefix = document.createElement("span");
        logTotalPrefix.textContent = "(오늘 총";

        const logTotalInput = document.createElement("input");
        logTotalInput.type = "number";
        logTotalInput.className = "material-log-total-input";
        logTotalInput.min = "0";
        logTotalInput.value = todayLoggedTotal;
        logTotalInput.addEventListener("change", function () {
          let val = parseInt(logTotalInput.value, 10);
          if (isNaN(val) || val < 0) val = 0;
          if (!material.dailyLog) material.dailyLog = {};
          const prevLogged = material.dailyLog[todayKey] || 0;
          const diff = val - prevLogged;
          material.dailyLog[todayKey] = val;
          material.currentPage = Math.max(0, Math.min(material.totalPages, material.currentPage + diff));
          saveMaterials();
          renderMaterials();
        });

        const logTotalSuffix = document.createElement("span");
        logTotalSuffix.textContent = unit + ")";

        logTotalWrap.appendChild(logTotalPrefix);
        logTotalWrap.appendChild(logTotalInput);
        logTotalWrap.appendChild(logTotalSuffix);

        logRow.appendChild(logLabel);
        logRow.appendChild(logInput);
        logRow.appendChild(logSuffix);
        logRow.appendChild(logBtn);
        logRow.appendChild(logTotalWrap);

        item.appendChild(header);
        item.appendChild(totalRow);
        item.appendChild(track);
        item.appendChild(statsRow);
        item.appendChild(paceRow);
        item.appendChild(logRow);
        materialsList.appendChild(item);
      });
    }

    renderMaterials();

    // ---- 독서 진행률 (오늘 도달한 페이지를 그대로 입력하면 자동으로 오늘 읽은 양 계산) ----
    const readingList = document.getElementById("reading-list");
    const readingAddTrigger = document.getElementById("reading-add-trigger");

    readingAddTrigger.addEventListener("click", function () {
      const color = materialColorPalette[readingBooks.length % materialColorPalette.length];
      readingBooks.push({ title: "", totalPages: 0, currentPage: 0, dailyLog: {}, color: color });
      saveReadingBooks();
      renderReadingBooks();
      const titleInputs = readingList.querySelectorAll(".material-title");
      titleInputs[titleInputs.length - 1].focus();
    });

    let readingBooks = JSON.parse(localStorage.getItem("readingBooks")) || [];

    function saveReadingBooks() {
      localStorage.setItem("readingBooks", JSON.stringify(readingBooks));
    }

    function renderReadingBooks() {
      readingList.innerHTML = "";
      const todayKey = formatDateKey(today);

      readingBooks.forEach(function (book, index) {
        const color = book.color || materialColorPalette[index % materialColorPalette.length];

        const item = document.createElement("div");
        item.className = "material-item";

        const header = document.createElement("div");
        header.className = "material-header";

        const title = document.createElement("input");
        title.className = "material-title";
        title.placeholder = "책 이름";
        title.value = book.title;
        title.addEventListener("change", function () {
          readingBooks[index].title = title.value;
          saveReadingBooks();
        });

        const removeBtn = document.createElement("span");
        removeBtn.className = "material-remove";
        removeBtn.textContent = "×";
        removeBtn.addEventListener("click", function () {
          if (removeBtn.classList.contains("confirm")) {
            const removedIndex = index;
            const removedBook = readingBooks[removedIndex];

            readingBooks.splice(removedIndex, 1);
            saveReadingBooks();
            renderReadingBooks();

            showUndoToast("책을 삭제했어요.", function () {
              readingBooks.splice(removedIndex, 0, removedBook);
              saveReadingBooks();
              renderReadingBooks();
            });
            return;
          }
          removeBtn.classList.add("confirm");
          removeBtn.textContent = "삭제?";
          setTimeout(function () {
            removeBtn.classList.remove("confirm");
            removeBtn.textContent = "×";
          }, 2500);
        });

        header.appendChild(title);
        header.appendChild(removeBtn);

        const totalRow = document.createElement("div");
        totalRow.className = "material-total-row";
        const totalLabel = document.createElement("span");
        totalLabel.textContent = "총";
        const totalInput = document.createElement("input");
        totalInput.type = "number";
        totalInput.className = "material-total-input";
        totalInput.min = "0";
        totalInput.value = book.totalPages || 0;
        totalInput.addEventListener("change", function () {
          let val = parseInt(totalInput.value, 10);
          if (isNaN(val) || val < 0) val = 0;
          readingBooks[index].totalPages = val;
          saveReadingBooks();
          renderReadingBooks();
        });
        const totalSuffix = document.createElement("span");
        totalSuffix.textContent = "쪽";
        totalRow.appendChild(totalLabel);
        totalRow.appendChild(totalInput);
        totalRow.appendChild(totalSuffix);

        const track = document.createElement("div");
        track.className = "material-progress-track";
        const fill = document.createElement("div");
        fill.className = "material-progress-fill";
        fill.style.background = color;
        const percent = book.totalPages > 0
          ? Math.min(100, Math.round(book.currentPage / book.totalPages * 100))
          : 0;
        fill.style.width = percent + "%";
        track.appendChild(fill);

        const remaining = Math.max(0, book.totalPages - book.currentPage);

        const statsRow = document.createElement("div");
        statsRow.className = "material-stats-row";

        const leftStat = document.createElement("span");
        leftStat.className = "material-current-wrap";

        const currentInput = document.createElement("input");
        currentInput.type = "number";
        currentInput.className = "material-current-input";
        currentInput.min = "0";
        currentInput.value = book.currentPage;
        currentInput.addEventListener("change", function () {
          let val = parseInt(currentInput.value, 10);
          if (isNaN(val) || val < 0) val = 0;
          if (val > book.totalPages) val = book.totalPages;
          readingBooks[index].currentPage = val;
          saveReadingBooks();
          renderReadingBooks();
        });

        const leftText = document.createElement("span");
        leftText.textContent = " / " + book.totalPages + "쪽 · " + percent + "%";

        leftStat.appendChild(currentInput);
        leftStat.appendChild(leftText);

        const rightStat = document.createElement("span");
        rightStat.textContent = remaining + "쪽 남음";
        statsRow.appendChild(leftStat);
        statsRow.appendChild(rightStat);

        const paceRow = document.createElement("div");
        paceRow.className = "material-pace-row";
        renderPaceEstimate(paceRow, book.dailyLog, remaining, "쪽", book.totalPages);

        // 오늘 읽은 양 = 오늘 기록된 dailyLog 값 (여러 번 입력해도 자동으로 누적됨)
        const todayRead = (book.dailyLog && book.dailyLog[todayKey]) || 0;
        const readRow = document.createElement("div");
        readRow.className = "material-log-row";

        const readLabel = document.createElement("span");
        readLabel.textContent = "오늘";

        const readInput = document.createElement("input");
        readInput.type = "number";
        readInput.className = "material-log-input";
        readInput.min = "0";
        // 이 칸은 "추가로 읽은 양"이 아니라 "지금까지 도달한 쪽수"를 입력하는 칸
        readInput.value = book.currentPage;

        const readSuffix = document.createElement("span");
        readSuffix.textContent = "쪽";

        const readBtn = document.createElement("button");
        readBtn.className = "material-log-btn";
        readBtn.textContent = "기록";
        readBtn.style.background = color + "30"; // 약 19% 불투명도
        readBtn.style.color = color;
        readBtn.addEventListener("click", function () {
          let entered = parseInt(readInput.value, 10);
          if (isNaN(entered) || entered < 0) entered = 0;
          if (book.totalPages > 0 && entered > book.totalPages) entered = book.totalPages;

          // 새로 입력한 페이지 - 지금까지 기록된 페이지 = 오늘(또는 이번 입력으로) 읽은 양
          const delta = entered - book.currentPage;
          if (!readingBooks[index].dailyLog) readingBooks[index].dailyLog = {};
          const prevToday = readingBooks[index].dailyLog[todayKey] || 0;
          readingBooks[index].dailyLog[todayKey] = Math.max(0, prevToday + delta);
          readingBooks[index].currentPage = entered;

          saveReadingBooks();
          renderReadingBooks();
        });

        const readNoteWrap = document.createElement("span");
        readNoteWrap.className = "setting-hint";
        readNoteWrap.textContent = "(오늘 총 " + todayRead + "쪽)";

        readRow.appendChild(readLabel);
        readRow.appendChild(readInput);
        readRow.appendChild(readSuffix);
        readRow.appendChild(readBtn);
        readRow.appendChild(readNoteWrap);

        item.appendChild(header);
        item.appendChild(totalRow);
        item.appendChild(track);
        item.appendChild(statsRow);
        item.appendChild(paceRow);
        item.appendChild(readRow);
        readingList.appendChild(item);
      });
    }

    renderReadingBooks();

    // ---- 오늘 할 일 (날짜별로 저장 — 그 날짜에서만 보임) ----
    const dailyTodoList = document.getElementById("daily-todo-items");
    const dailyTodoOverallProgress = document.getElementById("daily-todo-overall-progress");
    const dailyTodoAddTrigger = document.getElementById("daily-todo-add-trigger");

    dailyTodoAddTrigger.addEventListener("click", function () {
      dailyTodos.push({ text: "", status: "todo", progress: 0 });
      saveDailyTodosFor(selectedDate, dailyTodos);
      renderDailyTodos();
      const textInputs = dailyTodoList.querySelectorAll(".todo-text");
      textInputs[textInputs.length - 1].focus();
    });

    let dailyTodos = [];
    let hideDailyCompleted = false;

    const hideCompletedDailyBtn = document.getElementById("hide-completed-daily-btn");
    hideCompletedDailyBtn.addEventListener("click", function () {
      hideDailyCompleted = !hideDailyCompleted;
      hideCompletedDailyBtn.textContent = hideDailyCompleted ? "완료 표시" : "완료 숨기기";
      renderDailyTodos();
    });

    function loadDailyTodosFor(date) {
      const key = "dailytodos-" + formatDateKey(date);
      const arr = JSON.parse(localStorage.getItem(key)) || [];
      arr.forEach(migrateStatus);
      return arr;
    }

    function saveDailyTodosFor(date, arr) {
      const key = "dailytodos-" + formatDateKey(date);
      localStorage.setItem(key, JSON.stringify(arr));
    }

    function loadAndRenderDailyTodos() {
      dailyTodos = loadDailyTodosFor(selectedDate);
      renderDailyTodos();
    }

    // 완료/진행중/빈칸 다 포함해서, 항목별 progress(%)의 평균으로 전체 진행률을 계산
    function computeOverallProgress(items) {
      if (items.length === 0) return 0;
      const total = items.reduce(function (sum, item) { return sum + (item.progress || 0); }, 0);
      return Math.round(total / items.length);
    }

    function renderDailyTodos() {
      dailyTodoOverallProgress.textContent = "전체 " + computeOverallProgress(dailyTodos) + "%";

      dailyTodoList.innerHTML = "";

      const ul = document.createElement("ul");
      ul.className = "todo-ul";

      dailyTodos.forEach(function (todo, index) {
        if (hideDailyCompleted && todo.status === "done") return;

        const li = document.createElement("li");
        li.className = "todo-item";

        const row = document.createElement("div");
        row.className = "todo-item-row";

        const checkbox = document.createElement("div");
        checkbox.className = "tri-check" + (todo.status === "progress" ? " status-progress" : todo.status === "done" ? " status-done" : "");
        checkbox.addEventListener("click", function () {
          cycleDailyTodoStatus(index);
        });

        const textInput = document.createElement("textarea");
        textInput.className = "todo-text";
        textInput.rows = 1;
        textInput.value = todo.text;
        if (todo.status === "done") {
          textInput.style.textDecoration = "line-through";
          textInput.style.opacity = "0.4";
        }
        textInput.addEventListener("input", function () {
          autoResizeTextarea(textInput);
        });
        textInput.addEventListener("change", function () {
          dailyTodos[index].text = textInput.value;
          saveDailyTodosFor(selectedDate, dailyTodos);
        });
        textInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            textInput.blur();
          }
        });

        const progressInput = document.createElement("input");
        progressInput.type = "number";
        progressInput.className = "progress-input";
        progressInput.min = "0";
        progressInput.max = "100";
        progressInput.value = todo.progress || 0;
        progressInput.addEventListener("change", function () {
          let val = parseInt(progressInput.value, 10);
          if (isNaN(val)) val = 0;
          if (val < 0) val = 0;
          if (val > 100) val = 100;
          dailyTodos[index].progress = val;
          if (val === 100) {
            dailyTodos[index].status = "done";
          } else if (val === 0) {
            dailyTodos[index].status = "todo";
          } else {
            dailyTodos[index].status = "progress";
          }
          saveDailyTodosFor(selectedDate, dailyTodos);
          renderDailyTodos();
        });

        const percentSuffix = document.createElement("span");
        percentSuffix.className = "progress-percent-suffix";
        percentSuffix.textContent = "%";

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "×";
        deleteBtn.addEventListener("click", function () {
          deleteDailyTodo(index);
        });

        row.appendChild(checkbox);
        row.appendChild(textInput);
        row.appendChild(progressInput);
        row.appendChild(percentSuffix);
        row.appendChild(deleteBtn);

        const barTrack = document.createElement("div");
        barTrack.className = "progress-bar-track";
        const barFill = document.createElement("div");
        barFill.className = "progress-bar-fill";
        barFill.style.width = (todo.progress || 0) + "%";
        barTrack.appendChild(barFill);

        li.appendChild(row);
        li.appendChild(barTrack);
        ul.appendChild(li);
      });

      dailyTodoList.appendChild(ul);
      dailyTodoList.querySelectorAll(".todo-text").forEach(autoResizeTextarea);
    }

    function cycleDailyTodoStatus(index) {
      dailyTodos[index].status = nextStatus(dailyTodos[index].status);
      saveDailyTodosFor(selectedDate, dailyTodos);
      renderDailyTodos();
    }

    function deleteDailyTodo(index) {
      const dateAtDeletion = new Date(selectedDate);
      const beforeState = JSON.parse(JSON.stringify(dailyTodos));

      dailyTodos.splice(index, 1);
      saveDailyTodosFor(selectedDate, dailyTodos);
      renderDailyTodos();

      showUndoToast("할 일을 삭제했어요.", function () {
        saveDailyTodosFor(dateAtDeletion, beforeState);
        if (isSameDate(dateAtDeletion, selectedDate)) {
          dailyTodos = beforeState;
          renderDailyTodos();
        }
      });
    }

    loadAndRenderDailyTodos();

    const list = document.getElementById("todo-items");
    const todoOverallProgress = document.getElementById("todo-overall-progress");
    const addTrigger = document.getElementById("add-trigger");

    addTrigger.addEventListener("click", function () {
      todos.push({ text: "", status: "todo", progress: 0 });
      saveTodos();
      renderTodos();
      const textInputs = list.querySelectorAll(".todo-text");
      textInputs[textInputs.length - 1].focus();
    });

    let todos = JSON.parse(localStorage.getItem("todos")) || [];
    todos.forEach(migrateStatus);

    function saveTodos() {
      localStorage.setItem("todos", JSON.stringify(todos));
    }

    let hideCompleted = false;

    const hideCompletedBtn = document.getElementById("hide-completed-btn");
    hideCompletedBtn.addEventListener("click", function () {
      hideCompleted = !hideCompleted;
      hideCompletedBtn.textContent = hideCompleted ? "완료 표시" : "완료 숨기기";
      renderTodos();
    });

    function renderTodos() {
      todoOverallProgress.textContent = "전체 " + computeOverallProgress(todos) + "%";

      list.innerHTML = "";

      const todoList = document.createElement("ul");
      todoList.className = "todo-ul";

      todos.forEach(function (todo, index) {
        if (hideCompleted && todo.status === "done") return;

        const li = document.createElement("li");
        li.className = "todo-item";

        const row = document.createElement("div");
        row.className = "todo-item-row";

        const checkbox = document.createElement("div");
        checkbox.className = "tri-check" + (todo.status === "progress" ? " status-progress" : todo.status === "done" ? " status-done" : "");
        checkbox.addEventListener("click", function () {
          cycleTodoStatus(index);
        });

        const textInput = document.createElement("textarea");
        textInput.className = "todo-text";
        textInput.rows = 1;
        textInput.value = todo.text;
        if (todo.status === "done") {
          textInput.style.textDecoration = "line-through";
          textInput.style.opacity = "0.4";
        }
        textInput.addEventListener("input", function () {
          autoResizeTextarea(textInput);
        });
        textInput.addEventListener("change", function () {
          todos[index].text = textInput.value;
          saveTodos();
        });
        textInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            textInput.blur();
          }
        });

        const progressInput = document.createElement("input");
        progressInput.type = "number";
        progressInput.className = "progress-input";
        progressInput.min = "0";
        progressInput.max = "100";
        progressInput.value = todo.progress || 0;
        progressInput.addEventListener("change", function () {
          let val = parseInt(progressInput.value, 10);
          if (isNaN(val)) val = 0;
          if (val < 0) val = 0;
          if (val > 100) val = 100;
          todos[index].progress = val;
          if (val === 100) {
            todos[index].status = "done";
            todos[index].completedAt = Date.now();
          } else if (val === 0) {
            todos[index].status = "todo";
          } else {
            todos[index].status = "progress";
          }
          saveTodos();
          renderTodos();
        });

        const percentSuffix = document.createElement("span");
        percentSuffix.className = "progress-percent-suffix";
        percentSuffix.textContent = "%";

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "×";
        deleteBtn.addEventListener("click", function () {
          deleteTodo(index);
        });

        row.appendChild(checkbox);
        row.appendChild(textInput);
        row.appendChild(progressInput);
        row.appendChild(percentSuffix);
        row.appendChild(deleteBtn);

        const barTrack = document.createElement("div");
        barTrack.className = "progress-bar-track";
        const barFill = document.createElement("div");
        barFill.className = "progress-bar-fill";
        barFill.style.width = (todo.progress || 0) + "%";
        barTrack.appendChild(barFill);

        li.appendChild(row);
        li.appendChild(barTrack);
        todoList.appendChild(li);
      });

      list.appendChild(todoList);
      list.querySelectorAll(".todo-text").forEach(autoResizeTextarea);
    }

    function cycleTodoStatus(index) {
      todos[index].status = nextStatus(todos[index].status);
      todos[index].completedAt = todos[index].status === "done" ? Date.now() : null;
      saveTodos();
      renderTodos();
    }

    function deleteTodo(index) {
      const beforeState = JSON.parse(JSON.stringify(todos));

      todos.splice(index, 1);
      saveTodos();
      renderTodos();

      showUndoToast("할 일을 삭제했어요.", function () {
        todos = beforeState;
        saveTodos();
        renderTodos();
      });
    }

    renderTodos();

    // ---- 설정 모달 ----
    const settingsBtn = document.getElementById("settings-btn");
    const settingsOverlay = document.getElementById("settings-overlay");
    const settingsClose = document.getElementById("settings-close");

    settingsBtn.addEventListener("click", function () {
      settingsOverlay.classList.add("visible");
    });

    settingsClose.addEventListener("click", function () {
      settingsOverlay.classList.remove("visible");
    });

    settingsOverlay.addEventListener("click", function (event) {
      if (event.target === settingsOverlay) {
        settingsOverlay.classList.remove("visible");
      }
    });

    // ---- 카테고리 관리 (대분류 + 소분류 2단계) ----
    const categoryList = document.getElementById("category-list");
    const categoryNameInput = document.getElementById("category-name-input");
    const categoryColorInput = document.getElementById("category-color-input");
    const categoryAddBtn = document.getElementById("category-add-btn");

    function saveCategories() {
      localStorage.setItem("categories", JSON.stringify(categories));
    }

    // ---- 카테고리/소분류 삭제 확인 모달 ----
    const categoryDeleteOverlay = document.getElementById("category-delete-overlay");
    const categoryDeleteMessage = document.getElementById("category-delete-message");
    const categoryDeleteCancel = document.getElementById("category-delete-cancel");
    const categoryDeleteConfirm = document.getElementById("category-delete-confirm");
    let pendingDelete = null;

    // localStorage의 모든 schedule-* 항목을 훑어서, 이 카테고리(+소분류)를 쓰는 일정이 몇 개인지 셈
    function countScheduleUsage(categoryName, subcategoryName) {
      let count = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key || key.indexOf("schedule-") !== 0) continue;
        let items;
        try {
          items = JSON.parse(localStorage.getItem(key)) || [];
        } catch (e) {
          continue;
        }
        items.forEach(function (item) {
          if (item.category !== categoryName) return;
          if (subcategoryName !== undefined && item.subcategory !== subcategoryName) return;
          count++;
        });
      }
      return count;
    }

    function openCategoryDeleteModal(type, payload) {
      pendingDelete = Object.assign({ type: type }, payload);

      let label, count;
      if (type === "category") {
        const cat = categories[payload.index];
        label = cat.name || "이름 없는 카테고리";
        count = countScheduleUsage(cat.name);
      } else {
        const cat = categories[payload.catIndex];
        label = cat.subcategories[payload.subIndex] || "이름 없는 소분류";
        count = countScheduleUsage(cat.name, cat.subcategories[payload.subIndex]);
      }

      categoryDeleteMessage.textContent =
        "\"" + label + "\"을(를) 삭제하시겠어요?" +
        (count > 0
          ? " 이걸 쓰는 하루 일정이 " + count + "개 있어요. 그 일정 자체는 안 지워지지만, 카테고리 표시는 사라져요."
          : " 이걸 쓰는 하루 일정은 없어요.");

      categoryDeleteOverlay.classList.add("visible");
    }

    function closeCategoryDeleteModal() {
      pendingDelete = null;
      categoryDeleteOverlay.classList.remove("visible");
    }

    categoryDeleteCancel.addEventListener("click", closeCategoryDeleteModal);

    categoryDeleteOverlay.addEventListener("click", function (event) {
      if (event.target === categoryDeleteOverlay) closeCategoryDeleteModal();
    });

    categoryDeleteConfirm.addEventListener("click", function () {
      if (!pendingDelete) return;

      if (pendingDelete.type === "category") {
        categories.splice(pendingDelete.index, 1);
      } else {
        categories[pendingDelete.catIndex].subcategories.splice(pendingDelete.subIndex, 1);
      }

      saveCategories();
      renderCategories();
      closeCategoryDeleteModal();
    });

    function renderCategories() {
      categoryList.innerHTML = "";

      categories.forEach(function (cat, index) {
        const group = document.createElement("div");
        group.className = "category-group";

        // ---- 대분류 한 줄 ----
        const row = document.createElement("div");
        row.className = "category-row";

        const swatch = document.createElement("input");
        swatch.type = "color";
        swatch.className = "swatch";
        swatch.value = cat.color;
        swatch.addEventListener("change", function () {
          categories[index].color = swatch.value;
          saveCategories();
          renderCategories();
        });

        const name = document.createElement("input");
        name.className = "name";
        name.value = cat.name;
        name.addEventListener("change", function () {
          const oldName = categories[index].name;
          categories[index].name = name.value;
          saveCategories();
          renameCategoryEverywhere(oldName, name.value);
        });

        const removeBtn = document.createElement("span");
        removeBtn.className = "remove";
        removeBtn.textContent = "×";
        removeBtn.addEventListener("click", function () {
          openCategoryDeleteModal("category", { index: index });
        });

        row.appendChild(swatch);
        row.appendChild(name);
        row.appendChild(removeBtn);
        group.appendChild(row);

        // ---- 소분류 목록 (들여쓰기) ----
        const subList = document.createElement("div");
        subList.className = "subcategory-list";

        cat.subcategories.forEach(function (subName, subIndex) {
          const subRow = document.createElement("div");
          subRow.className = "subcategory-row";

          const dot = document.createElement("span");
          dot.className = "sub-dot";
          dot.style.background = cat.color;

          const subNameInput = document.createElement("input");
          subNameInput.className = "name";
          subNameInput.value = subName;
          subNameInput.addEventListener("change", function () {
            const oldSubName = categories[index].subcategories[subIndex];
            categories[index].subcategories[subIndex] = subNameInput.value;
            saveCategories();
            renameSubcategoryEverywhere(cat.name, oldSubName, subNameInput.value);
          });

          const subRemoveBtn = document.createElement("span");
          subRemoveBtn.className = "remove";
          subRemoveBtn.textContent = "×";
          subRemoveBtn.addEventListener("click", function () {
            openCategoryDeleteModal("subcategory", { catIndex: index, subIndex: subIndex });
          });

          subRow.appendChild(dot);
          subRow.appendChild(subNameInput);
          subRow.appendChild(subRemoveBtn);
          subList.appendChild(subRow);
        });

        // ---- 소분류 추가 입력창 ----
        const addSubInput = document.createElement("input");
        addSubInput.className = "subcategory-add-input";
        addSubInput.placeholder = "+ 하위 카테고리 추가";
        addSubInput.addEventListener("keydown", function (event) {
          if (event.key !== "Enter") return;
          const val = addSubInput.value;
          if (val === "") return;
          categories[index].subcategories.push(val);
          saveCategories();
          renderCategories();
        });
        subList.appendChild(addSubInput);

        group.appendChild(subList);
        categoryList.appendChild(group);
      });

      renderCategoryStats();
    }

    // categoryName, subcategoryName을 넘기면 실제로 화면에 쓸 색을 계산해줌
    // - 소분류를 골랐으면: 대분류 색을 연하게 만든 색
    // - 대분류만 있으면: 대분류 색 그대로
    // - 못 찾으면(삭제된 카테고리 등): null
    function getCategoryColor(categoryName, subcategoryName) {
      const cat = categories.find(function (c) { return c.name === categoryName; });
      if (!cat) return null;
      if (subcategoryName && cat.subcategories.indexOf(subcategoryName) !== -1) {
        return cat.color;
      }
      return cat.color;
    }

    function createCategoryPicker(selectedCategory, selectedSubcategory, onChange) {
      const wrapper = document.createElement("div");
      wrapper.className = "category-picker";

      const trigger = document.createElement("div");
      trigger.className = "category-picker-trigger";
      const color = getCategoryColor(selectedCategory, selectedSubcategory);
      if (color) {
        trigger.classList.add("has-color");
        trigger.style.background = color;
        trigger.style.borderColor = color;
      }

      const menu = document.createElement("div");
      menu.className = "category-picker-menu";

      function stopFocusSteal(el) {
        el.addEventListener("mousedown", function (event) {
          event.preventDefault();
        });
      }

      // "카테고리 없음"
      const noneOpt = document.createElement("div");
      noneOpt.className = "category-picker-option";
      const noneDot = document.createElement("span");
      noneDot.className = "dot";
      const noneLabel = document.createElement("span");
      noneLabel.textContent = "카테고리 없음";
      noneOpt.appendChild(noneDot);
      noneOpt.appendChild(noneLabel);
      stopFocusSteal(noneOpt);
      noneOpt.addEventListener("click", function (event) {
        event.stopPropagation();
        menu.classList.remove("open");
        onChange("", "");
      });
      menu.appendChild(noneOpt);

      categories.forEach(function (cat) {
        const catRow = document.createElement("div");
        catRow.className = "category-picker-option";

        const dot = document.createElement("span");
        dot.className = "dot has-color";
        dot.style.background = cat.color;

        const label = document.createElement("span");
        label.textContent = cat.name;
        label.style.flex = "1";

        catRow.appendChild(dot);
        catRow.appendChild(label);
        stopFocusSteal(catRow);

        if (cat.subcategories.length === 0) {
          // 소분류가 없으면 대분류 클릭만으로 바로 선택 완료
          catRow.addEventListener("click", function (event) {
            event.stopPropagation();
            menu.classList.remove("open");
            onChange(cat.name, "");
          });
          menu.appendChild(catRow);
        } else {
          // 소분류가 있으면, 대분류 클릭은 목록을 펼치기만 하고(아코디언)
          // 실제 선택은 소분류를 클릭해야 완료됨
          const arrow = document.createElement("span");
          arrow.textContent = "›";
          arrow.style.opacity = "0.5";
          arrow.style.marginLeft = "4px";
          catRow.appendChild(arrow);

          const subGroup = document.createElement("div");
          subGroup.className = "category-picker-subgroup";

          cat.subcategories.forEach(function (subName) {
            const subRow = document.createElement("div");
            subRow.className = "category-picker-option sub";

            const subDot = document.createElement("span");
            subDot.className = "dot has-color";
            subDot.style.background = cat.color;

            const subLabel = document.createElement("span");
            subLabel.textContent = subName;

            subRow.appendChild(subDot);
            subRow.appendChild(subLabel);
            stopFocusSteal(subRow);

            subRow.addEventListener("click", function (event) {
              event.stopPropagation();
              menu.classList.remove("open");
              subGroup.classList.remove("open");
              onChange(cat.name, subName);
            });

            subGroup.appendChild(subRow);
          });

          catRow.addEventListener("click", function (event) {
            event.stopPropagation();
            subGroup.classList.toggle("open");
          });

          menu.appendChild(catRow);
          menu.appendChild(subGroup);
        }
      });

      stopFocusSteal(trigger);
      trigger.addEventListener("click", function (event) {
        event.stopPropagation();
        document.querySelectorAll(".category-picker-menu.open").forEach(function (openMenu) {
          if (openMenu !== menu) openMenu.classList.remove("open");
        });
        menu.classList.toggle("open");
      });

      wrapper.appendChild(trigger);
      wrapper.appendChild(menu);
      return wrapper;
    }

    // 드롭다운 바깥을 클릭하면 열려있는 메뉴를 전부 닫음
    document.addEventListener("click", function () {
      document.querySelectorAll(".category-picker-menu.open").forEach(function (openMenu) {
        openMenu.classList.remove("open");
      });
      document.querySelectorAll(".category-picker-subgroup.open").forEach(function (openGroup) {
        openGroup.classList.remove("open");
      });
    });

    // 대분류 이름을 바꾸면, 이미 저장된 태그/일정 데이터에서도 이름을 맞춰줘야 색이 안 끊김
    function renameCategoryEverywhere(oldName, newName) {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.indexOf("tags-") === 0 || key.indexOf("schedule-") === 0) {
          const arr = JSON.parse(localStorage.getItem(key));
          let changed = false;
          arr.forEach(function (item) {
            if (item.category === oldName) {
              item.category = newName;
              changed = true;
            }
          });
          if (changed) localStorage.setItem(key, JSON.stringify(arr));
        }
      }
      renderWeek();
      renderCategories();
      loadAndRenderSchedule();
    }

    // 소분류 이름을 바꾸면, 그 대분류+소분류 조합을 쓰던 데이터도 같이 맞춰줌
    function renameSubcategoryEverywhere(categoryName, oldSubName, newSubName) {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.indexOf("tags-") === 0 || key.indexOf("schedule-") === 0) {
          const arr = JSON.parse(localStorage.getItem(key));
          let changed = false;
          arr.forEach(function (item) {
            if (item.category === categoryName && item.subcategory === oldSubName) {
              item.subcategory = newSubName;
              changed = true;
            }
          });
          if (changed) localStorage.setItem(key, JSON.stringify(arr));
        }
      }
      renderWeek();
      renderCategories();
      loadAndRenderSchedule();
    }

    categoryAddBtn.addEventListener("click", function () {
      const name = categoryNameInput.value;
      if (name === "") return;
      categories.push({ name: name, color: categoryColorInput.value, subcategories: [] });
      saveCategories();
      renderCategories();
      categoryNameInput.value = "";
    });

    categoryNameInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        categoryAddBtn.click();
      }
    });


    renderCategories();

    // ---- 하루 전환 기준 (고정 시간만 사용) ----
    const cutoffHourInput = document.getElementById("cutoff-hour-input");
    const cutoffMinuteInput = document.getElementById("cutoff-minute-input");
    const ampmButtons = document.querySelectorAll("#ampm-segment .segment-btn");

    let appSettings = JSON.parse(localStorage.getItem("appSettings")) || {
      cutoffTime: "04:00"
    };

    function saveAppSettings() {
      localStorage.setItem("appSettings", JSON.stringify(appSettings));
    }

    // "04:00"(24시간) <-> {시(1~12), 분, 오전/오후} 서로 변환
    function splitCutoffTime(timeStr) {
      const parts = timeStr.split(":");
      const hour24 = parseInt(parts[0], 10);
      const minute = parseInt(parts[1], 10);
      const ampm = hour24 < 12 ? "AM" : "PM";
      let hour12 = hour24 % 12;
      if (hour12 === 0) hour12 = 12;
      return { hour12: hour12, minute: minute, ampm: ampm };
    }

    function combineCutoffTime(hour12, minute, ampm) {
      let hour24 = hour12 % 12;
      if (ampm === "PM") hour24 += 12;
      return pad2(hour24) + ":" + pad2(minute);
    }

    function loadCutoffTimeUI() {
      const parts = splitCutoffTime(appSettings.cutoffTime);
      cutoffHourInput.value = pad2(parts.hour12);
      cutoffMinuteInput.value = pad2(parts.minute);
      ampmButtons.forEach(function (btn) {
        btn.classList.toggle("active", btn.dataset.value === parts.ampm);
      });
    }

    function commitCutoffTime() {
      let hour12 = parseInt(cutoffHourInput.value, 10);
      if (isNaN(hour12) || hour12 < 1) hour12 = 1;
      if (hour12 > 12) hour12 = 12;

      let minute = parseInt(cutoffMinuteInput.value, 10);
      if (isNaN(minute) || minute < 0) minute = 0;
      if (minute > 59) minute = 59;

      cutoffHourInput.value = pad2(hour12);
      cutoffMinuteInput.value = pad2(minute);

      const activeAmpmBtn = document.querySelector("#ampm-segment .segment-btn.active");
      const ampm = activeAmpmBtn ? activeAmpmBtn.dataset.value : "AM";

      appSettings.cutoffTime = combineCutoffTime(hour12, minute, ampm);
      saveAppSettings();
      // today가 페이지 로드 시 한 번만 계산되므로, 바뀐 기준을 바로 반영하려면 새로고침이 필요함
      location.reload();
    }

    cutoffHourInput.addEventListener("change", commitCutoffTime);
    cutoffMinuteInput.addEventListener("change", commitCutoffTime);

    ampmButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        ampmButtons.forEach(function (b) {
          b.classList.toggle("active", b === btn);
        });
        commitCutoffTime();
      });
    });

    loadCutoffTimeUI();
  </script>
</body>
</html>
