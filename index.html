<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>TimeBlocking Planner</title>
  <style>
    :root {
      --bg: oklch(0.97 0.006 95);
      --card: #ffffff;
      --border: oklch(0.9 0.005 95);
      --text: oklch(0.25 0.01 95);
      --muted: oklch(0.52 0.01 95);
      --blue: oklch(0.55 0.14 255);
      --blue-bg: oklch(0.94 0.03 255);
      --blue-light: oklch(0.75 0.09 255);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      font-family: system-ui, -apple-system, 'Malgun Gothic', sans-serif;
      color: var(--text);
    }

    .container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 40px 32px 80px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 26px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-title {
      font: 700 20px system-ui, sans-serif;
      color: var(--text);
    }

    .card-subtitle {
      font: 13px system-ui, sans-serif;
      color: var(--muted);
    }

    .placeholder-note {
      font: 12px system-ui, sans-serif;
      color: var(--muted);
      opacity: 0.7;
    }

    /* 주간 플래너 (자리만) */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
    }

    .week-day {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .week-day .day-name {
      font: 700 14px system-ui, sans-serif;
      color: var(--text);
    }

    .week-day .day-date {
      font: 11px system-ui, sans-serif;
      color: var(--muted);
    }

    .week-day.selected {
      border-color: var(--blue);
      background: var(--blue-bg);
    }

    .week-day.today .day-name,
    .week-day.today .day-date {
      color: oklch(0.62 0.13 70);
    }

    .week-nav-btn {
      border: none;
      background: var(--bg);
      color: var(--muted);
      width: 22px;
      height: 22px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
    }

    .week-nav-btn:hover {
      color: var(--blue);
    }

    .today-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font: 600 11px system-ui, sans-serif;
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .today-btn:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .today-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .today-btn:disabled:hover {
      border-color: var(--border);
      color: var(--muted);
    }

    .day-tag {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      background: #A3BE8C30;
      color: #A3BE8C;
      font: 600 10px system-ui, sans-serif;
      border-radius: 6px;
      padding: 3px 6px;
    }

    .day-tag .tag-remove {
      cursor: pointer;
      opacity: 0.6;
      flex: none;
    }

    .day-tag .tag-remove:hover {
      opacity: 1;
    }

    .day-add-trigger {
      font: 600 10px system-ui, sans-serif;
      color: var(--muted);
      cursor: pointer;
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 3px 6px;
      text-align: center;
    }

    .day-add-trigger:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .day-add-input {
      font: 11px system-ui, sans-serif;
      border: 1px solid var(--blue);
      border-radius: 6px;
      padding: 3px 6px;
      outline: none;
      width: 100%;
      box-sizing: border-box;
    }

    /* 아래 2단 레이아웃 */
    .lower-row {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .today-column {
      flex: 1.6;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .today-panel {
      min-height: 300px;
    }

    .side-panels {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .side-panels .card {
      padding: 18px 20px;
      gap: 10px;
    }

    .section-title {
      font: 700 15px system-ui, sans-serif;
      color: var(--text);
      margin: 0;
    }

    /* 할 일 목록 (진짜 기능) */
    .add-trigger {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font: 600 12px system-ui, sans-serif;
      color: var(--muted);
    }

    .add-trigger:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .add-trigger.small {
      padding: 6px 10px;
      font-size: 11px;
    }

    .add-row {
      display: none;
      gap: 8px;
    }

    .add-row.visible {
      display: flex;
    }

    .add-row input {
      font: 14px system-ui, sans-serif;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
      background: var(--bg);
      color: var(--text);
    }

    .add-row input:focus {
      background: var(--card);
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-bg);
    }

    #todo-input { flex: 2; }

    .add-row button {
      font: 600 14px system-ui, sans-serif;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      flex: none;
    }

    .add-row button:hover { opacity: 0.9; }

    .todo-ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .todo-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: transparent;
      border-radius: 6px;
      padding: 5px 6px;
    }

    .todo-item:hover {
      background: var(--bg);
    }

    .todo-item-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .progress-input {
      width: 34px;
      flex: none;
      font: 600 12px system-ui, sans-serif;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 3px;
      text-align: right;
      outline: none;
      background: var(--card);
      -moz-appearance: textfield;
    }

    .progress-input::-webkit-inner-spin-button,
    .progress-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .progress-input:focus {
      border-color: var(--blue);
      color: var(--text);
    }

    .progress-percent-suffix {
      font: 12px system-ui, sans-serif;
      color: var(--muted);
      margin-left: -5px;
      flex: none;
    }

    .progress-bar-track {
      height: 4px;
      border-radius: 2px;
      background: var(--bg);
      overflow: hidden;
      margin-left: 25px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--blue-light);
      border-radius: 2px;
    }

    .tri-check {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      min-width: 16px;
      border-radius: 4px;
      border: 1.5px solid var(--border);
      background: transparent;
      cursor: pointer;
      position: relative;
      margin: 0;
    }

    .tri-check.status-progress {
      border: none;
      border-radius: 50%;
      background: conic-gradient(var(--blue-light) 0deg 180deg, var(--border) 180deg 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2.5px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2.5px));
    }

    .tri-check.status-done {
      background: var(--blue);
      border-color: var(--blue);
    }

    .tri-check.status-done::after {
      content: "✓";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
    }

    .todo-item .todo-text {
      flex: 1;
      min-width: 0;
      font: 13px system-ui, sans-serif;
      font-family: inherit;
      color: var(--text);
      border: none;
      outline: none;
      background: transparent;
      padding: 3px 4px;
      border-radius: 4px;
      resize: none;
      overflow: hidden;
      line-height: 1.5;
      display: block;
    }

    .todo-item .todo-text:focus {
      background: var(--card);
      box-shadow: 0 0 0 1.5px var(--blue);
    }

    .todo-item button {
      font: 700 13px system-ui, sans-serif;
      color: var(--muted);
      opacity: 0;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0 2px;
    }

    .todo-item:hover button {
      opacity: 0.5;
    }

    .todo-item button:hover {
      opacity: 1 !important;
      color: var(--blue);
    }

    .time-input-wrap {
      display: flex;
      align-items: center;
      flex: none;
    }

    .time-part-input {
      font: 600 13px ui-monospace, Menlo, monospace;
      color: var(--muted);
      width: 20px;
      border: none;
      background: transparent;
      outline: none;
      border-radius: 4px;
      padding: 2px 1px;
      text-align: center;
    }

    .time-part-input:focus {
      background: var(--blue-bg);
      color: var(--blue);
    }

    .time-colon {
      font: 600 13px ui-monospace, Menlo, monospace;
      color: var(--muted);
    }

    .schedule-box {
      flex: 1;
      min-height: 40px;
      border-radius: 10px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4px 14px;
    }

    .schedule-box:has(.schedule-reason-input) {
      justify-content: flex-start;
      padding-top: 4px;
    }

    .schedule-box-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
    }

    .schedule-box .check {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      border: 1.5px solid var(--border);
      background: var(--card);
      flex: none;
      cursor: pointer;
      position: relative;
    }

    .schedule-box .check.skipped {
      background: #d64545;
      border-color: #d64545;
    }

    .schedule-box .check.skipped::after {
      content: "✕";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
    }

    .schedule-box .check.done {
      background: var(--blue);
      border-color: var(--blue);
    }

    .schedule-box .check.done::after {
      content: "✓";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 10px;
    }

    .task-input {
      font: 600 13px system-ui, sans-serif;
      border: none;
      outline: none;
      background: transparent;
      flex: 1;
      color: var(--text);
      width: 100%;
    }

    .schedule-reason-input {
      display: block;
      width: 100%;
      margin: -4px 0 4px 0;
      font: 10px system-ui, sans-serif;
      color: #d64545;
      background: transparent;
      border: none;
      padding: 0 0 2px 50px;
      outline: none;
    }

    .schedule-reason-input::placeholder {
      color: #d6454580;
    }

    .schedule-box .remove {
      cursor: pointer;
      color: var(--muted);
      font: 700 13px system-ui, sans-serif;
      opacity: 0.6;
      flex: none;
    }

    .schedule-box .remove:hover {
      opacity: 1;
      color: var(--blue);
    }

    .schedule-box .remove.confirm {
      opacity: 1;
      color: #d64545;
      font-size: 11px;
    }

    .schedule-gap {
      display: flex;
      align-items: center;
      height: 8px;
      margin: -8px 0;
    }

    .schedule-gap-spacer {
      width: 20px;
      flex: none;
    }

    .schedule-gap-triangle {
      cursor: pointer;
      color: var(--border);
      font-size: 12px;
      line-height: 1;
      padding: 2px 6px;
      margin-left: 18px;
    }

    .schedule-gap-triangle:hover {
      color: var(--blue);
    }

    .schedule-gap-rest {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 8px;
    }

    .schedule-gap-remove {
      cursor: pointer;
      color: var(--muted);
      font: 700 10px system-ui, sans-serif;
      opacity: 0.6;
      flex: none;
    }

    .schedule-gap-remove:hover {
      opacity: 1;
      color: #d64545;
    }

    .schedule-gap-time {
      width: 34px;
      flex: none;
      font: 600 10px ui-monospace, Menlo, monospace;
      color: var(--muted);
      border: none;
      background: transparent;
      outline: none;
      padding: 0;
    }

    .schedule-gap-time:focus {
      color: var(--blue);
    }

    .schedule-gap-bar {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      background: var(--border);
    }

    .settings-btn {
      position: fixed;
      top: 28px;
      right: 32px;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      z-index: 50;
    }

    .settings-btn:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .undo-toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 12px);
      background: var(--text);
      color: var(--card);
      font: 13px system-ui, sans-serif;
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .undo-toast.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }

    .undo-toast button {
      background: none;
      border: none;
      color: var(--blue-bg);
      font: 700 13px system-ui, sans-serif;
      cursor: pointer;
      flex: none;
    }

    .undo-toast button:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal-panel {
      background: var(--card);
      border-radius: 18px;
      padding: 26px 28px;
      width: 380px;
      max-width: 90vw;
      max-height: 85vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
    }

    .modal-panel .section-title {
      margin-top: 14px;
      margin-bottom: 2px;
    }

    .modal-panel .section-title:first-of-type {
      margin-top: 0;
    }

    .modal-close {
      cursor: pointer;
      color: var(--muted);
      font: 300 22px system-ui, sans-serif;
      line-height: 1;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .modal-close:hover {
      color: var(--text);
      background: var(--bg);
    }

    .category-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border-radius: 10px;
      padding: 6px 8px 6px 10px;
    }

    .category-row .swatch {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 6px;
      border: none;
      padding: 0;
      cursor: pointer;
      background: none;
    }

    .category-row .swatch::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .category-row .swatch::-webkit-color-swatch {
      border: none;
      border-radius: 6px;
    }

    .category-row .swatch::-moz-color-swatch {
      border: none;
      border-radius: 6px;
    }

    .category-row .name {
      flex: 1;
      font: 13px system-ui, sans-serif;
      color: var(--text);
      background: transparent;
      border: none;
      outline: none;
      padding: 4px 2px;
      border-radius: 6px;
    }

    .category-row .name:focus {
      background: var(--card);
      box-shadow: 0 0 0 1.5px var(--blue);
    }

    .category-row .remove {
      cursor: pointer;
      color: var(--muted);
      opacity: 0.5;
      font: 700 14px system-ui, sans-serif;
      flex: none;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    .category-row .remove:hover {
      opacity: 1;
      color: var(--blue);
      background: var(--card);
    }

    .category-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .subcategory-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-left: 26px;
    }

    .subcategory-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border-radius: 8px;
      padding: 5px 8px;
    }

    .subcategory-row .sub-dot {
      width: 12px;
      height: 12px;
      min-width: 12px;
      border-radius: 4px;
    }

    .subcategory-row .name {
      flex: 1;
      font: 12px system-ui, sans-serif;
      color: var(--text);
      background: transparent;
      border: none;
      outline: none;
    }

    .subcategory-row .remove {
      cursor: pointer;
      opacity: 0.5;
      color: var(--muted);
      font: 700 12px system-ui, sans-serif;
    }

    .subcategory-row .remove:hover {
      opacity: 1;
      color: var(--blue);
    }

    .subcategory-add-input {
      font: 12px system-ui, sans-serif;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      outline: none;
      background: transparent;
      color: var(--muted);
    }

    .subcategory-add-input:focus {
      border-style: solid;
      border-color: var(--blue);
      color: var(--text);
    }

    .category-picker-subgroup {
      display: none;
      flex-direction: column;
      padding-left: 18px;
    }

    .category-picker-subgroup.open {
      display: flex;
    }

    .category-picker-option.sub {
      font-size: 11px;
    }

    .trash-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .trash-row .swatch {
      width: 14px;
      height: 14px;
      min-width: 14px;
      border-radius: 4px;
    }

    .trash-row .name {
      flex: 1;
      font: 13px system-ui, sans-serif;
      color: var(--muted);
    }

    .trash-row button {
      font: 600 12px system-ui, sans-serif;
      background: var(--card);
      color: var(--blue);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      cursor: pointer;
      flex: none;
    }

    .trash-row button:hover {
      border-color: var(--blue);
    }

    .trash-row button.confirm {
      color: #d64545;
      border-color: #d64545;
    }

    .category-add-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #category-name-input {
      font: 13px system-ui, sans-serif;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
      flex: 1;
      background: var(--bg);
      color: var(--text);
    }

    #category-name-input:focus {
      background: var(--card);
      border-color: var(--blue);
    }

    #category-color-input {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 0;
      cursor: pointer;
      background: var(--card);
    }

    #category-color-input::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    #category-color-input::-webkit-color-swatch {
      border: none;
      border-radius: 9px;
    }

    #category-color-input::-moz-color-swatch {
      border: none;
      border-radius: 9px;
    }

    #category-add-btn {
      font: 600 13px system-ui, sans-serif;
      background: var(--bg);
      color: var(--blue);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      flex: none;
    }

    #category-add-btn:hover {
      border-color: var(--blue);
      background: var(--blue-bg);
    }

    .modal-panel select {
      font: 13px system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);

<body>
  <button class="settings-btn" id="settings-btn">⚙</button>

  <div class="undo-toast" id="undo-toast">
    <span id="undo-toast-message"></span>
    <button id="undo-toast-btn">되돌리기</button>
  </div>

  <div class="modal-overlay" id="settings-overlay">
    <div class="modal-panel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="card-title" style="font-size:16px;">설정</div>
        <span class="modal-close" id="settings-close">×</span>
      </div>

      <div class="section-title">카테고리</div>
      <div id="category-list" style="display:flex; flex-direction:column; gap:8px;"></div>
      <div class="category-add-row">
        <input type="text" id="category-name-input" placeholder="카테고리 이름 (예: 운동)" />
        <input type="color" id="category-color-input" value="#6a8dfc" />
        <button id="category-add-btn">추가</button>
      </div>

      <div class="section-title">하루 전환 기준</div>
      <div class="setting-hint">이 시각을 기준으로 하루가 전환돼요.</div>
      <div class="time-picker" id="cutoff-time-picker">
        <div class="segmented small" id="ampm-segment">
          <button type="button" class="segment-btn" data-value="AM">오전</button>
          <button type="button" class="segment-btn" data-value="PM">오후</button>
        </div>
        <div class="time-fields">
          <input type="text" id="cutoff-hour-input" maxlength="2" inputmode="numeric" />
          <span>:</span>
          <input type="text" id="cutoff-minute-input" maxlength="2" inputmode="numeric" />
        </div>
      </div>

      <div class="section-title">삭제된 습관</div>
      <div class="setting-hint">시간 제한 없이 언제든 복구할 수 있어요.</div>
      <div id="habit-trash-list" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>

  <div class="modal-overlay" id="habit-history-overlay">
    <div class="modal-panel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="card-title" style="font-size:16px;">기록</div>
        <span class="modal-close" id="habit-history-close">×</span>
      </div>
      <div id="habit-history-list" style="display:flex; flex-direction:column; gap:4px; margin-top:10px;"></div>
    </div>
  </div>

  <div class="modal-overlay" id="category-delete-overlay">
    <div class="modal-panel" style="width:320px;">
      <div class="card-title" style="font-size:16px;">삭제하시겠어요?</div>
      <div id="category-delete-message" class="setting-hint" style="margin-top:8px; line-height:1.5;"></div>
      <div style="display:flex; gap:8px; margin-top:18px; justify-content:flex-end;">
        <span class="habit-remove" id="category-delete-cancel" style="opacity:0.7; align-self:center;">취소</span>
        <button id="category-delete-confirm" style="background:#d64545; color:#fff; border:none; border-radius:8px; padding:8px 16px; font:600 13px system-ui, sans-serif; cursor:pointer;">삭제</button>
      </div>
    </div>
  </div>

  <div class="container">
    <h1 id="today-title"></h1>

      <div style="display:flex; align-items:center; justify-content:space-between;">

        </div>
      </div>
      <div class="week-grid" id="week-grid"></div>

        </div>

          <div style="display:flex; align-items:center; justify-content:space-between;">
            <div class="section-title">할 일 목록</div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span class="setting-hint" id="todo-overall-progress"></span>
              <span class="habit-remove" id="hide-completed-btn" style="opacity:0.7;">완료 숨기기</span>
            </div>
          </div>
          <div id="todo-items"></div>
          <div class="add-trigger" id="add-trigger">+ 할 일 추가</div>
        </div>

        <!-- 독서 진행률: 읽고 있는 페이지를 그대로 입력하면 자동 계산됨 -->
        <div class="card" id="reading-progress-card">
          <div class="section-title">독서 진행률</div>
          <div id="reading-list" style="display:flex; flex-direction:column; gap:16px; margin-top:8px;"></div>
          <div class="add-trigger" id="reading-add-trigger">+ 책 추가</div>
        </div>
      </div>
    </div>

    <div class="card" id="category-stats-card">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div class="card-title">카테고리별 통계</div>
        <div class="segmented small" id="stats-view-segment">
          <button type="button" class="segment-btn" data-value="daily">일별</button>
          <button type="button" class="segment-btn" data-value="weekly">주별</button>
          <button type="button" class="segment-btn" data-value="monthly">월별</button>
        </div>
      </div>
      <div id="category-stats-rows" style="display:flex; flex-direction:column; gap:10px; margin-top:10px;"></div>
      <div id="category-stats-legend" style="display:flex; align-items:center; gap:16px; margin-top:12px; flex-wrap:wrap;"></div>
    </div>

    <div class="card" id="subcategory-stats-card">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
        <div class="card-title">하위 카테고리별 통계</div>
        <div class="segmented small" id="subcat-stats-view-segment">
          <button type="button" class="segment-btn" data-value="daily">일별</button>
          <button type="button" class="segment-btn" data-value="weekly">주별</button>
          <button type="button" class="segment-btn" data-value="monthly">월별</button>
        </div>
      </div>
      <div style="display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:10px;">
        <div class="card-subtitle" id="subcat-period-label"></div>
        <button class="week-nav-btn" id="subcat-prev-btn">〈</button>
        <button class="today-btn" id="subcat-today-btn">오늘</button>
        <button class="week-nav-btn" id="subcat-next-btn">〉</button>
      </div>
      <div id="subcategory-select-row" style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;"></div>
      <div id="subcategory-stats-rows" style="display:flex; flex-direction:column; gap:20px; margin-top:12px;"></div>
      <div class="setting-hint" style="margin-top:18px; border-top:1px solid var(--border); padding-top:14px;">추이 (최근 7개 구간)</div>
      <div id="subcategory-line-chart" style="margin-top:8px;"></div>
      <div id="subcategory-line-legend" style="display:flex; gap:14px; flex-wrap:wrap; margin-top:8px;"></div>
    </div>
  </div>

  <script>
    // ---- 되돌리기 토스트 (삭제 시 공통으로 사용) ----
    const undoToast = document.getElementById("undo-toast");
    const undoToastMessage = document.getElementById("undo-toast-message");
    const undoToastBtn = document.getElementById("undo-toast-btn");
    let undoTimeoutId = null;
    let pendingUndoAction = null;

    function showUndoToast(message, undoAction) {
      undoToastMessage.textContent = message;
      pendingUndoAction = undoAction;
      undoToast.classList.add("visible");

      if (undoTimeoutId) clearTimeout(undoTimeoutId);
      undoTimeoutId = setTimeout(function () {
        undoToast.classList.remove("visible");
        pendingUndoAction = null;
      }, 5000);
    }

    undoToastBtn.addEventListener("click", function () {
      if (pendingUndoAction) {
        pendingUndoAction();
      }
      undoToast.classList.remove("visible");
      clearTimeout(undoTimeoutId);
      pendingUndoAction = null;
    });

    const todayTitle = document.getElementById("today-title");
    const weekdayNames = ["일", "월", "화", "수", "목", "금", "토"];
    const weekdayShort = ["월", "화", "수", "목", "금", "토", "일"];
    const weekOrdinals = ["첫째", "둘째", "셋째", "넷째", "다섯째"];

    function pad2(n) {
      return n < 10 ? "0" + n : "" + n;
    }

    // 빈 상자 → 진행 중(초록) → 완료(파랑) → 다시 빈 상자로 순환 (할 일 목록 / 오늘 할 일에서 사용)
    function nextStatus(current) {
      if (current === "progress") return "done";
      if (current === "done") return "todo";
      return "progress";
    }

    // 빈 상자 → 완료(파랑) → 못함(빨강 X) → 다시 빈 상자로 순환 (하루 일정표 전용)
    function nextScheduleStatus(current) {
      if (current === "done") return "skipped";
      if (current === "skipped") return "todo";
      return "done";
    }

    // 예전 버전의 done(true/false) 데이터를 status 문자열로 변환 (하위 호환)
    function migrateStatus(item) {
      if (item.status === undefined) {
        item.status = item.done ? "done" : "todo";
        delete item.done;
      }
      return item;
    }

    // 글자 수에 맞춰 textarea 높이를 자동으로 늘려줌 (한 줄로 시작, 넘치면 커짐)
    function autoResizeTextarea(el) {
      el.style.height = "auto";
      el.style.height = el.scrollHeight + "px";
    }

    function formatDateKey(date) {
      return date.getFullYear() + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate());
    }

    function isSameDate(a, b) {
      return formatDateKey(a) === formatDateKey(b);
    }

    function addDays(date, n) {
      const d = new Date(date);
      d.setDate(d.getDate() + n);
      return d;
    }

    function getMonday(date) {
      const d = new Date(date);
      const offset = (d.getDay() + 6) % 7; // 월요일=0 이 되도록 보정
      d.setDate(d.getDate() - offset);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    // 하루 마감 기준: 기본은 자정에 바로 다음날로 전환.
    // 단, 어제 일정 중 새벽(오전 6시 이전) 시간대 항목이 있으면
    // 그중 가장 늦은 시각 + 10분까지는 아직 "어제"로 쳐줌.
    function computeEffectiveToday() {
      const now = new Date();
      const calendarToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const candidateYesterday = addDays(calendarToday, -1);

      // appSettings 변수는 스크립트 훨씬 아래(설정 섹션)에서 선언되므로,
      // 여기서는 변수를 직접 참조하지 않고 localStorage에서 바로 읽어와 TDZ 문제를 피함
      const settings = JSON.parse(localStorage.getItem("appSettings")) || { cutoffTime: "04:00" };

      const parts = (settings.cutoffTime || "04:00").split(":");
      const cutoffHour = parseInt(parts[0], 10) || 0;
      const cutoffMinute = parseInt(parts[1], 10) || 0;
      const cutoff = new Date(calendarToday);
      cutoff.setHours(cutoffHour, cutoffMinute, 0, 0);
      return now < cutoff ? candidateYesterday : calendarToday;
    }

    // 날짜별 일정 저장/불러오기 (computeEffectiveToday보다 먼저 정의되지만,
    // function 선언은 끌어올려지므로(hoisting) 순서 상관없이 호출 가능해요.
    function loadScheduleFor(date) {
      const key = "schedule-" + formatDateKey(date);
      const arr = JSON.parse(localStorage.getItem(key)) || [];
      arr.forEach(migrateStatus);
      return arr;
    }

    function saveScheduleFor(date, arr) {
      const key = "schedule-" + formatDateKey(date);
      localStorage.setItem(key, JSON.stringify(arr));
    }

    const today = computeEffectiveToday();

    todayTitle.textContent =
      today.getFullYear() + "년 " +
      (today.getMonth() + 1) + "월 " +
      today.getDate() + "일 " +
      weekdayNames[today.getDay()] + "요일";

    let selectedDate = new Date(today);
    let weekAnchor = getMonday(today);
    let categories = JSON.parse(localStorage.getItem("categories")) || [];
    categories.forEach(function (cat) {
      if (!cat.subcategories) cat.subcategories = [];
    });

    // 주간 카드에 보이는 요약 태그 — 하루 일정표(schedule)와는 별개의 저장소
    function loadTagsFor(date) {
      const key = "tags-" + formatDateKey(date);
      return JSON.parse(localStorage.getItem(key)) || [];
    }

    function saveTagsFor(date, arr) {
      const key = "tags-" + formatDateKey(date);
      localStorage.setItem(key, JSON.stringify(arr));
    }

    // 예전 버전에서 "오늘" 하나만 저장하던 데이터를 오늘 날짜 키로 옮겨줌
    const legacySchedule = localStorage.getItem("schedule");
    if (legacySchedule && !localStorage.getItem("schedule-" + formatDateKey(today))) {
      localStorage.setItem("schedule-" + formatDateKey(today), legacySchedule);
      localStorage.removeItem("schedule");
    }

    // ---- 주간 플래너 카드 ----
    const weekGrid = document.getElementById("week-grid");
    const weekLabel = document.getElementById("week-label");
    const weekPrevBtn = document.getElementById("week-prev-btn");
    const weekNextBtn = document.getElementById("week-next-btn");
    const goTodayBtn = document.getElementById("go-today-btn");

    function renderWeek() {
      weekGrid.innerHTML = "";

      const weekNumber = Math.ceil(weekAnchor.getDate() / 7);
      weekLabel.textContent = (weekAnchor.getMonth() + 1) + "월 " + weekOrdinals[weekNumber - 1] + " 주";

      for (let i = 0; i < 7; i++) {
        const date = addDays(weekAnchor, i);
        const items = loadTagsFor(date);

        const box = document.createElement("div");
        box.className = "week-day";
        if (isSameDate(date, today)) box.classList.add("today");
        if (isSameDate(date, selectedDate)) box.classList.add("selected");

        box.addEventListener("click", function (event) {
          if (event.target.closest(".day-tag") || event.target.closest(".day-add-trigger") || event.target.closest(".day-add-input")) {
            return;
          }
          selectedDate = new Date(date);
          loadAndRenderSchedule();
          loadAndRenderDailyTodos();
          renderWeek();
        });

        const nameRow = document.createElement("div");
        nameRow.style.display = "flex";
        nameRow.style.justifyContent = "space-between";

        const dayName = document.createElement("span");
        dayName.className = "day-name";
        dayName.textContent = weekdayShort[i];

        const dayDate = document.createElement("span");
        dayDate.className = "day-date";
        dayDate.textContent = date.getDate() + "일";

        nameRow.appendChild(dayName);
        nameRow.appendChild(dayDate);
        box.appendChild(nameRow);

        items.forEach(function (item, idx) {
          const tag = document.createElement("div");
          tag.className = "day-tag";

          const tagText = document.createElement("span");
          tagText.textContent = item.text === "" ? "(내용 없음)" : item.text;

          const tagRemove = document.createElement("span");
          tagRemove.className = "tag-remove";
          tagRemove.textContent = "×";
          tagRemove.addEventListener("click", function () {
            const arr = loadTagsFor(date);
            arr.splice(idx, 1);
            saveTagsFor(date, arr);
            renderWeek();
          });

          tag.appendChild(tagText);
          tag.appendChild(tagRemove);
          box.appendChild(tag);
        });

        const addTrigger = document.createElement("div");
        addTrigger.className = "day-add-trigger";
        addTrigger.textContent = "+ 일정";
        addTrigger.addEventListener("click", function () {
          const addInput = document.createElement("input");
          addInput.className = "day-add-input";
          addInput.placeholder = "메모";

          addTrigger.replaceWith(addInput);
          addInput.focus();

          let committed = false;

          function commit() {
            if (committed) return;
            committed = true;
            const text = addInput.value;
            if (text !== "") {
              const arr = loadTagsFor(date);
              arr.push({ text: text });
              saveTagsFor(date, arr);
            }
            renderWeek();
          }

          addInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") commit();
          });
          addInput.addEventListener("blur", commit);
        });
        box.appendChild(addTrigger);

        weekGrid.appendChild(box);
      }
    }

    weekPrevBtn.addEventListener("click", function () {
      weekAnchor = addDays(weekAnchor, -7);
      renderWeek();
    });

    weekNextBtn.addEventListener("click", function () {
      weekAnchor = addDays(weekAnchor, 7);
      renderWeek();
    });

    goTodayBtn.addEventListener("click", function () {
      weekAnchor = getMonday(today);
      selectedDate = new Date(today);
      renderWeek();
      loadAndRenderSchedule();
      loadAndRenderDailyTodos();
    });

    // ---- 오늘 일정 (선택된 날짜) 패널 ----
    const scheduleList = document.getElementById("schedule-items");
    const scheduleAddTrigger = document.getElementById("schedule-add-trigger");
    const schedulePanelTitle = document.getElementById("schedule-panel-title");

    let schedule = [];

    // 아침 8시부터 밤 11시까지, 1시간 단위 빈 칸을 기본값으로 만들어줌
    function generateDefaultSchedule() {
      const defaults = [];
      for (let hour = 8; hour <= 23; hour++) {
        defaults.push({ time: pad2(hour) + ":00", text: "", status: "todo", category: "", subcategory: "" });
      }
      return defaults;
    }

    function updateSchedulePanelTitle() {
      if (isSameDate(selectedDate, today)) {
        schedulePanelTitle.textContent = "오늘 · " + weekdayNames[selectedDate.getDay()] + "요일";
      } else {
        schedulePanelTitle.textContent =
          (selectedDate.getMonth() + 1) + "월 " + selectedDate.getDate() + "일 " +
          weekdayNames[selectedDate.getDay()] + "요일";
      }
    }

    function loadAndRenderSchedule() {
      const key = "schedule-" + formatDateKey(selectedDate);
      const stored = localStorage.getItem(key);
      if (stored === null) {
        // 이 날짜를 한 번도 연 적이 없으면 기본 시간표를 만들어서 저장
        schedule = generateDefaultSchedule();
        saveScheduleFor(selectedDate, schedule);
      } else {
        schedule = JSON.parse(stored);
      }
      updateSchedulePanelTitle();
      renderSchedule();
    }

    // 24시 다음은 25시가 아니라 1시로 순환
    function nextHour(hour) {
      const next = hour + 1;
      return next > 24 ? 1 : next;
    }

    // 정렬용 기준값 계산 — 00:00~04:00은 하루를 마무리하는 새벽 시간으로 보고 맨 뒤로 보냄
    function scheduleSortKey(timeStr) {
      const parts = (timeStr || "00:00").split(":");
      let h = parseInt(parts[0], 10);
      if (isNaN(h)) h = 0;
      const m = parts[1] || "00";
      if (h < 5) h += 24; // 0~4시는 24~28시로 취급해서 23시보다 뒤로 가게 함
      return pad2(h) + ":" + m;
    }

    // 마지막 칸 시간(예: "23:00") 다음 시각을 계산해서 새 칸 이름표로 씀
    function nextTimeLabel(lastTime) {
      const parts = (lastTime || "").split(":");
      let hour = parseInt(parts[0], 10);
      if (isNaN(hour)) hour = 23;
      return pad2(nextHour(hour)) + ":00";
    }

    function renderSchedule() {
      scheduleList.innerHTML = "";

      schedule.forEach(function (item, index) {
        // 휴식 블록은 일반 블록과 완전히 다른(얇은 막대) 모습으로 그림
        if (item.isRest) {
          const gap = document.createElement("div");
          gap.className = "schedule-gap has-rest";

          const gapSpacer = document.createElement("div");
          gapSpacer.className = "schedule-gap-spacer";
          gap.appendChild(gapSpacer);

          const restBox = document.createElement("div");
          restBox.className = "schedule-gap-rest";

          const gapRemove = document.createElement("span");
          gapRemove.className = "schedule-gap-remove";
          gapRemove.textContent = "×";
          gapRemove.addEventListener("click", function () {
            removeRestBlock(index);
          });

          const gapTime = document.createElement("input");
          gapTime.type = "text";
          gapTime.className = "schedule-gap-time";
          gapTime.value = item.time;
          gapTime.addEventListener("change", function () {
            const parts = gapTime.value.split(":");
            let h = parseInt(parts[0], 10);
            let m = parseInt(parts[1], 10);
            if (isNaN(h)) h = parseInt(item.time.split(":")[0], 10);
            if (isNaN(m)) m = parseInt(item.time.split(":")[1], 10);
            updateRestTime(index, pad2(h) + ":" + pad2(m));
          });

          const gapBar = document.createElement("div");
          gapBar.className = "schedule-gap-bar";

          restBox.appendChild(gapRemove);
          restBox.appendChild(gapTime);
          restBox.appendChild(gapBar);
          gap.appendChild(restBox);
          scheduleList.appendChild(gap);
          return;
        }

        const row = document.createElement("div");
        row.style.display = "flex";
        row.style.alignItems = "center";
        row.style.gap = "8px";
        row.className = "schedule-row-wrap";

        const timeWrap = document.createElement("div");
        timeWrap.className = "time-input-wrap";

        const timeParts = (item.time || "").split(":");

        // 값만 저장 (재정렬/재렌더링은 안 함) — 시→분 자동 이동 중에 화면이 흔들리지 않게
        function commitTimeSilent() {
          let h = parseInt(hourInput.value, 10);
          let m = parseInt(minuteInput.value, 10);
          if (isNaN(h) || h < 0) h = 0;
          if (isNaN(m) || m < 0) m = 0;
          if (m > 59) m = 59;
          schedule[index].time = pad2(h) + ":" + pad2(m);
          saveScheduleFor(selectedDate, schedule);
        }

        // 시/분을 다 마쳤을 때 최종 확정 (정렬 + 화면 갱신까지)
        function commitTime() {
          let h = parseInt(hourInput.value, 10);
          let m = parseInt(minuteInput.value, 10);
          if (isNaN(h) || h < 0) h = 0;
          if (isNaN(m) || m < 0) m = 0;
          if (m > 59) m = 59;
          hourInput.value = pad2(h);
          minuteInput.value = pad2(m);
          schedule[index].time = pad2(h) + ":" + pad2(m);
          saveScheduleFor(selectedDate, schedule);
          renderSchedule();
        }

        const hourInput = document.createElement("input");
        hourInput.className = "time-part-input";
        hourInput.inputMode = "numeric";
        hourInput.maxLength = 2;
        hourInput.value = timeParts[0] || "00";
        hourInput.addEventListener("input", function () {
          hourInput.value = hourInput.value.replace(/[^0-9]/g, "").slice(0, 2);
          if (hourInput.value.length === 2) minuteInput.focus();
        });
        hourInput.addEventListener("change", commitTimeSilent);

        const colon = document.createElement("span");
        colon.className = "time-colon";
        colon.textContent = ":";

        const minuteInput = document.createElement("input");
        minuteInput.className = "time-part-input";
        minuteInput.inputMode = "numeric";
        minuteInput.maxLength = 2;
        minuteInput.value = timeParts[1] || "00";
        minuteInput.addEventListener("input", function () {
          minuteInput.value = minuteInput.value.replace(/[^0-9]/g, "").slice(0, 2);
        });
        minuteInput.addEventListener("change", commitTime);
        minuteInput.addEventListener("keydown", function (event) {
          // 분칸에서 백스페이스로 지우다가 비면, 시간칸으로 자연스럽게 돌아감
          if (event.key === "Backspace" && minuteInput.value === "") {
            hourInput.focus();
          }
        });

        timeWrap.appendChild(hourInput);
        timeWrap.appendChild(colon);
        timeWrap.appendChild(minuteInput);

        const box = document.createElement("div");
        box.className = "schedule-box";

        const color = getCategoryColor(item.category, item.subcategory);
        if (color) {
          box.style.background = color + "1f";
        }

        const categoryPicker = createCategoryPicker(item.category, item.subcategory, function (newCategory, newSubcategory) {
          schedule[index].category = newCategory;
          schedule[index].subcategory = newSubcategory;
          saveScheduleFor(selectedDate, schedule);
          renderSchedule();
        });

        const check = document.createElement("div");
        check.className = "check" + (item.status === "skipped" ? " skipped" : item.status === "done" ? " done" : "");
        check.addEventListener("click", function () {
          cycleScheduleStatus(index);
        });

        const textInput = document.createElement("input");
        textInput.className = "task-input";
        textInput.placeholder = "일정 추가";
        textInput.value = item.text;
        if (item.status === "done") {
          textInput.style.textDecoration = "line-through";
          textInput.style.opacity = "0.4";
        } else if (item.status === "skipped") {
          textInput.style.textDecoration = "line-through";
          textInput.style.opacity = "0.5";
          textInput.style.color = "#d64545";
        }
        textInput.addEventListener("change", function () {
          schedule[index].text = textInput.value;
          saveScheduleFor(selectedDate, schedule);
          renderWeek();
        });
        textInput.addEventListener("keydown", function (event) {
          if (event.key !== "Enter") return;
          event.preventDefault();

          // 지금 입력 내용을 먼저 저장
          schedule[index].text = textInput.value;
          saveScheduleFor(selectedDate, schedule);
          renderWeek();

          // 바로 다음 시간대 칸으로 포커스 이동 (내용은 안 지움)
          const taskInputs = scheduleList.querySelectorAll(".task-input");
          const nextInput = taskInputs[index + 1];
          if (nextInput) {
            nextInput.focus();
            const len = nextInput.value.length;
            nextInput.setSelectionRange(len, len);
          }
        });

        const removeBtn = document.createElement("span");
        removeBtn.className = "remove";
        removeBtn.textContent = "×";
        removeBtn.addEventListener("click", function () {
          if (removeBtn.classList.contains("confirm")) {
            deleteSchedule(index);
            return;
          }
          removeBtn.classList.add("confirm");
          removeBtn.textContent = "삭제?";
          setTimeout(function () {
            removeBtn.classList.remove("confirm");
            removeBtn.textContent = "×";
          }, 2500);
        });

        const boxRow = document.createElement("div");
        boxRow.className = "schedule-box-row";
        boxRow.appendChild(categoryPicker);
        boxRow.appendChild(check);
        boxRow.appendChild(textInput);
        boxRow.appendChild(removeBtn);
        box.appendChild(boxRow);

        // "못함(X)" 상태일 때만, 박스 안쪽 텍스트 바로 아래에 이유를 적는 작은 메모 줄이 나타남
        if (item.status === "skipped") {
          const reasonInput = document.createElement("input");
          reasonInput.className = "schedule-reason-input";
          reasonInput.placeholder = "못한 이유";
          reasonInput.value = item.failReason || "";
          reasonInput.addEventListener("change", function () {
            schedule[index].failReason = reasonInput.value;
            saveScheduleFor(selectedDate, schedule);
          });
          box.appendChild(reasonInput);
        }

        row.appendChild(timeWrap);
        row.appendChild(box);
        scheduleList.appendChild(row);

        // 바로 다음 자리가 비어있을 때만(이미 휴식이 있으면 안 보임) 휴식 추가 삼각형을 보여줌
        const next = schedule[index + 1];
        if (next && !next.isRest) {
          const gap = document.createElement("div");
          gap.className = "schedule-gap";

          const gapSpacer = document.createElement("div");
          gapSpacer.className = "schedule-gap-spacer";
          gap.appendChild(gapSpacer);

          const gapTriangle = document.createElement("span");
          gapTriangle.className = "schedule-gap-triangle";
          gapTriangle.textContent = "▷";
          gapTriangle.title = "휴식 추가";
          gapTriangle.addEventListener("click", function () {
            insertRestBlock(index);
          });
          gap.appendChild(gapTriangle);

          scheduleList.appendChild(gap);
        }
      });

      renderCategoryStats();
    }

    // ---- 카테고리별 통계 (일별/주별/월별) ----
    const statsViewButtons = document.querySelectorAll("#stats-view-segment .segment-btn");
    const categoryStatsRows = document.getElementById("category-stats-rows");
    const categoryStatsLegend = document.getElementById("category-stats-legend");
    let statsViewMode = "daily";

    statsViewButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        statsViewMode = btn.dataset.value;
        statsViewButtons.forEach(function (b) {
          b.classList.toggle("active", b === btn);
        });
        renderCategoryStats();
      });
    });

    // 같은 하루 일정 안에서, 각 항목이 "다음 일정까지" 실제로 몇 분짜리였는지 계산
    // 맨 마지막 항목은 다음 일정이 없으니, 그 다음 정각(예: 23:20이면 24:00)까지로 계산
    //
    // 휴식 블록도 schedule 배열의 진짜 항목이라(카테고리만 없음) 별도 처리 없이
    // 이 계산에 자연스럽게 같이 섞여 들어감. 카테고리별 통계 쪽에서 카테고리 없는
    // 항목을 걸러내기 때문에, 휴식 시간은 자동으로 카테고리 집계에서 빠짐.
    function nextHourBoundary(startMin) {
      let boundary = Math.ceil(startMin / 60) * 60;
      if (boundary === startMin) boundary += 60;
      return boundary;
    }

    function getItemDurations(scheduleItems) {
      const sorted = scheduleItems.slice().sort(function (a, b) {
        return scheduleSortKey(a.time).localeCompare(scheduleSortKey(b.time));
      });

      return sorted.map(function (item, i) {
        const next = sorted[i + 1];
        const startMin = timeToExtendedMinutes(item.time);

        let minutes;
        if (!next) {
          minutes = nextHourBoundary(startMin) - startMin;
        } else {
          minutes = timeToExtendedMinutes(next.time) - startMin;
          minutes = minutes > 0 ? minutes : 0;
        }

        return { item: item, minutes: minutes };
      });
    }

    // scheduleSortKey와 같은 기준(0~4시는 24~28시로 취급)으로 "자정부터 몇 분째인지" 계산
    function timeToExtendedMinutes(timeStr) {
      const parts = (timeStr || "00:00").split(":");
      let h = parseInt(parts[0], 10);
      if (isNaN(h)) h = 0;
      const m = parseInt(parts[1], 10) || 0;
      if (h < 5) h += 24;
      return h * 60 + m;
    }

    // timeToExtendedMinutes의 역함수 — 확장된 분 값을 실제 "HH:MM" 시계 시각으로 되돌림
    function extendedMinutesToTime(extMin) {
      const totalMin = ((extMin % 1440) + 1440) % 1440;
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      return pad2(h) + ":" + pad2(m);
    }

    // 소수점 시간을 화면에 보기 좋게(소수점 1자리까지만) 표시
    function formatHours(h) {
      const rounded = Math.round(h * 10) / 10;
      return rounded % 1 === 0 ? String(rounded) : rounded.toFixed(1);
    }

    // 대분류(item.category)별로, 다음 일정까지의 실제 시간(분→시간)을 합산
    // 체크(완료)된 항목만 집계 — 체크 안 된 건 예정일 뿐 아직 수행된 게 아니므로 제외
    function tallyCategoryHours(scheduleItems) {
      const totals = {};
      getItemDurations(scheduleItems).forEach(function (d) {
        if (!d.item.category || d.minutes === 0 || d.item.status !== "done") return;
        totals[d.item.category] = (totals[d.item.category] || 0) + d.minutes / 60;
      });
      return totals;
    }

    // 특정 대분류 안에서 소분류별 실제 시간을 합산 (하위 카테고리별 통계에서 사용)
    // 마찬가지로 체크(완료)된 항목만 집계
    function tallySubcategoryHours(scheduleItems, categoryName) {
      const totals = {};
      getItemDurations(scheduleItems).forEach(function (d) {
        if (d.item.category !== categoryName || !d.item.subcategory || d.minutes === 0 || d.item.status !== "done") return;
        totals[d.item.subcategory] = (totals[d.item.subcategory] || 0) + d.minutes / 60;
      });
      return totals;
    }

    function mergeTotals(target, source) {
      Object.keys(source).forEach(function (key) {
        target[key] = (target[key] || 0) + source[key];
      });
    }

    // tallyFn을 넘겨받아서, 대분류든 소분류든 같은 방식으로 일/주/월 집계를 만들어줌
    function getDailyRows(tallyFn) {
      const rows = [];
      for (let i = 0; i < 7; i++) {
        const date = addDays(today, -i);
        rows.push({ label: date.getDate() + "일", totals: tallyFn(loadScheduleFor(date)) });
      }
      return rows;
    }

    function getWeeklyRows(tallyFn) {
      const thisMonday = getMonday(today);
      const rows = [];
      for (let w = 0; w < 4; w++) {
        const weekStart = addDays(thisMonday, -7 * w);
        const combined = {};
        for (let i = 0; i < 7; i++) {
          mergeTotals(combined, tallyFn(loadScheduleFor(addDays(weekStart, i))));
        }
        const label = w === 0 ? "이번 주" : w + "주 전";
        rows.push({ label: label, totals: combined });
      }
      return rows;
    }

    function getMonthlyRows(tallyFn) {
      const rows = [];
      for (let m = 0; m < 4; m++) {
        const monthDate = new Date(today.getFullYear(), today.getMonth() - m, 1);
        const daysInMonth = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0).getDate();
        const combined = {};
        for (let d = 1; d <= daysInMonth; d++) {
          const date = new Date(monthDate.getFullYear(), monthDate.getMonth(), d);
          mergeTotals(combined, tallyFn(loadScheduleFor(date)));
        }
        rows.push({ label: (monthDate.getMonth() + 1) + "월", totals: combined });
      }
      return rows;
    }

    function getDailyStatsRows() {
      return getDailyRows(tallyCategoryHours);
    }

    function getWeeklyStatsRows() {
      return getWeeklyRows(tallyCategoryHours);
    }

    function getMonthlyStatsRows() {
      return getMonthlyRows(tallyCategoryHours);
    }

    function renderCategoryStats() {
      let rows;
      if (statsViewMode === "weekly") {
        rows = getWeeklyStatsRows();
      } else if (statsViewMode === "monthly") {
        rows = getMonthlyStatsRows();
      } else {
        rows = getDailyStatsRows();
      }

      categoryStatsRows.innerHTML = "";

      // 먼저 각 행의 총 시간을 구하고, 그중 가장 큰 값을 기준(100%)으로 삼음
      const rowTotals = rows.map(function (row) {
        return Object.keys(row.totals).reduce(function (sum, key) {
          return sum + row.totals[key];
        }, 0);
      });
      const maxTotal = Math.max.apply(null, rowTotals.concat([0]));

      rows.forEach(function (row, rowIndex) {
        const rowEl = document.createElement("div");
        rowEl.className = "stats-row";

        const label = document.createElement("div");
        label.className = "stats-row-label";
        label.textContent = row.label;

        const barTrack = document.createElement("div");
        barTrack.className = "stats-bar-track";

        const bar = document.createElement("div");
        bar.className = "stats-bar";

        const totalHours = rowTotals[rowIndex];

        if (totalHours === 0 || maxTotal === 0) {
          bar.style.width = "0%";
        } else {
          // 이 행의 막대 전체 길이 = (이 행의 총 시간 / 가장 바쁜 행의 총 시간)
          bar.style.width = (totalHours / maxTotal * 100) + "%";

          categories.forEach(function (cat) {
            const hours = row.totals[cat.name];
            if (!hours) return;
            const segment = document.createElement("div");
            segment.className = "stats-bar-segment";
            // 막대 안에서 세그먼트 비율은 여전히 "이 행 안에서의 비중" 그대로
            segment.style.width = (hours / totalHours * 100) + "%";
            segment.style.background = cat.color;
            segment.style.color = "#000";
            segment.textContent = formatHours(hours) + "h";
            bar.appendChild(segment);
          });
        }

        barTrack.appendChild(bar);
        rowEl.appendChild(label);
        rowEl.appendChild(barTrack);
        categoryStatsRows.appendChild(rowEl);
      });

      renderCategoryStatsLegend();
      renderSubcategorySelect();
      renderSubcategoryStats();
    }

    function renderCategoryStatsLegend() {
      categoryStatsLegend.innerHTML = "";

      categories.forEach(function (cat) {
        const item = document.createElement("div");
        item.className = "stats-legend-item";
        item.style.background = cat.color + "47"; // 약 28% 불투명도
        item.style.color = "var(--text)";

        const dot = document.createElement("span");
        dot.className = "stats-legend-dot";
        dot.style.background = cat.color;

        const label = document.createElement("span");
        label.textContent = cat.name;

        item.appendChild(dot);
        item.appendChild(label);
        categoryStatsLegend.appendChild(item);
      });
    }

    // ---- 하위 카테고리별 통계 (소분류 목록 + 네비게이션으로 기간 이동) ----
    const subcategorySelectRow = document.getElementById("subcategory-select-row");
    const subcategoryStatsRows = document.getElementById("subcategory-stats-rows");
    const subcatStatsViewButtons = document.querySelectorAll("#subcat-stats-view-segment .segment-btn");
    const subcatPrevBtn = document.getElementById("subcat-prev-btn");
    const subcatNextBtn = document.getElementById("subcat-next-btn");
    const subcatTodayBtn = document.getElementById("subcat-today-btn");
    const subcatPeriodLabel = document.getElementById("subcat-period-label");

    let selectedStatsCategory = null;
    let subcatStatsViewMode = "daily";
    let subcatNavAnchor = new Date(today); // 지금 보고 있는 기준 날짜(일/주/월 계산의 기준점)

    subcatStatsViewButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        subcatStatsViewMode = btn.dataset.value;
        subcatStatsViewButtons.forEach(function (b) {
          b.classList.toggle("active", b === btn);
        });
        // 단위(일/주/월)를 바꾸면 다시 "지금 시점" 기준으로 리셋
        subcatNavAnchor = new Date(today);
        renderSubcategoryStats();
      });
    });

    subcatPrevBtn.addEventListener("click", function () {
      if (subcatStatsViewMode === "weekly") {
        subcatNavAnchor = addDays(subcatNavAnchor, -7);
      } else if (subcatStatsViewMode === "monthly") {
        subcatNavAnchor = new Date(subcatNavAnchor.getFullYear(), subcatNavAnchor.getMonth() - 1, 1);
      } else {
        subcatNavAnchor = addDays(subcatNavAnchor, -1);
      }
      renderSubcategoryStats();
    });

    subcatNextBtn.addEventListener("click", function () {
      if (subcatStatsViewMode === "weekly") {
        subcatNavAnchor = addDays(subcatNavAnchor, 7);
      } else if (subcatStatsViewMode === "monthly") {
        subcatNavAnchor = new Date(subcatNavAnchor.getFullYear(), subcatNavAnchor.getMonth() + 1, 1);
      } else {
        subcatNavAnchor = addDays(subcatNavAnchor, 1);
      }
      renderSubcategoryStats();
    });

    subcatTodayBtn.addEventListener("click", function () {
      subcatNavAnchor = new Date(today);
      renderSubcategoryStats();
    });

    function renderSubcategorySelect() {
      const catsWithSubs = categories.filter(function (cat) {
        return cat.subcategories.length > 0;
      });

      // 이미 선택했던 카테고리가 삭제됐거나, 아직 선택한 게 없으면 첫 번째로 맞춰줌
      const stillValid = catsWithSubs.some(function (cat) { return cat.name === selectedStatsCategory; });
      if (!stillValid) {
        selectedStatsCategory = catsWithSubs.length > 0 ? catsWithSubs[0].name : null;
      }

      subcategorySelectRow.innerHTML = "";

      catsWithSubs.forEach(function (cat) {
        const isActive = cat.name === selectedStatsCategory;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "subcat-select-btn" + (isActive ? " active" : "");
        if (isActive) {
          btn.style.background = cat.color + "30"; // 약 19% 불투명도
          btn.style.color = cat.color;
        }

        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = cat.color;

        const label = document.createElement("span");
        label.textContent = cat.name;

        btn.appendChild(dot);
        btn.appendChild(label);
        btn.addEventListener("click", function () {
          selectedStatsCategory = cat.name;
          renderSubcategorySelect();
          renderSubcategoryStats();
        });
        subcategorySelectRow.appendChild(btn);
      });
    }

    // 지금 보고 있는 기간(하루/한 주/한 달)을 사람이 읽기 좋은 문구로 변환
    function formatSubcatPeriodLabel() {
      if (subcatStatsViewMode === "weekly") {
        const monday = getMonday(subcatNavAnchor);
        const sunday = addDays(monday, 6);
        return (monday.getMonth() + 1) + "월 " + monday.getDate() + "일 ~ " +
          (sunday.getMonth() + 1) + "월 " + sunday.getDate() + "일";
      }
      if (subcatStatsViewMode === "monthly") {
        return subcatNavAnchor.getFullYear() + "년 " + (subcatNavAnchor.getMonth() + 1) + "월";
      }
      return (subcatNavAnchor.getMonth() + 1) + "월 " + subcatNavAnchor.getDate() + "일 " +
        weekdayNames[subcatNavAnchor.getDay()] + "요일";
    }

    // 대분류 + 소분류 하나를 정해서, 지금 보고 있는 "한 기간" 동안의 시간을 셈
    function tallySubcategoryForPeriod(categoryName, subName) {
      let hours = 0;

      function countIn(date) {
        const totals = tallySubcategoryHours(loadScheduleFor(date), categoryName);
        hours += totals[subName] || 0;
      }

      if (subcatStatsViewMode === "weekly") {
        const monday = getMonday(subcatNavAnchor);
        for (let i = 0; i < 7; i++) countIn(addDays(monday, i));
      } else if (subcatStatsViewMode === "monthly") {
        const daysInMonth = new Date(subcatNavAnchor.getFullYear(), subcatNavAnchor.getMonth() + 1, 0).getDate();
        for (let d = 1; d <= daysInMonth; d++) {
          countIn(new Date(subcatNavAnchor.getFullYear(), subcatNavAnchor.getMonth(), d));
        }
      } else {
        countIn(subcatNavAnchor);
      }

      return hours;
    }

    function renderSubcategoryStats() {
      subcatPeriodLabel.textContent = formatSubcatPeriodLabel();
      subcatTodayBtn.disabled = isSameDate(subcatNavAnchor, today) && subcatStatsViewMode === "daily";

      subcategoryStatsRows.innerHTML = "";

      if (!selectedStatsCategory) {
        const empty = document.createElement("div");
        empty.className = "setting-hint";
        empty.textContent = "하위 카테고리가 있는 카테고리가 없어요. 설정에서 먼저 추가해주세요.";
        subcategoryStatsRows.appendChild(empty);
        subcategoryLineChart.innerHTML = "";
        subcategoryLineLegend.innerHTML = "";
        return;
      }

      const cat = categories.find(function (c) { return c.name === selectedStatsCategory; });
      if (!cat) return;

      renderSubcategoryLineChart(cat);

      // 소분류별로 이번 기간의 시간을 미리 다 구해둠
      const hoursBySubcategory = cat.subcategories.map(function (subName) {
        return { name: subName, hours: tallySubcategoryForPeriod(cat.name, subName) };
      });

      const totalHours = hoursBySubcategory.reduce(function (sum, s) { return sum + s.hours; }, 0);

      if (totalHours === 0) {
        const empty = document.createElement("div");
        empty.className = "setting-hint";
        empty.textContent = "이 기간엔 기록이 없어요.";
        subcategoryStatsRows.appendChild(empty);
        return;
      }

      // 막대 길이 기준: 보기 단위에 따라 기본값을 다르게 둠 (그보다 큰 값이 있으면 그 값을 기준(100%)으로 삼음)
      const baseHours = subcatStatsViewMode === "monthly" ? 30 : subcatStatsViewMode === "weekly" ? 18 : 5;
      const maxHours = Math.max.apply(null, hoursBySubcategory.map(function (s) { return s.hours; }).concat([baseHours]));

      hoursBySubcategory.forEach(function (s) {
        const rowEl = document.createElement("div");
        rowEl.className = "stats-row";

        const label = document.createElement("div");
        label.className = "subcat-row-label";
        label.textContent = s.name;

        const track = document.createElement("div");
        track.className = "stats-bar-track";

        const bar = document.createElement("div");
        bar.className = "stats-bar";
        bar.style.width = (s.hours / maxHours * 100) + "%";

        if (s.hours > 0) {
          const segment = document.createElement("div");
          segment.className = "stats-bar-segment";
          segment.style.width = "100%";
          segment.style.background = cat.color;
          segment.style.color = "#000";
          segment.textContent = formatHours(s.hours) + "h";
          bar.appendChild(segment);
        }

        track.appendChild(bar);
        rowEl.appendChild(label);
        rowEl.appendChild(track);
        subcategoryStatsRows.appendChild(rowEl);
      });
    }

    // ---- 추이 선 그래프 (최근 7개 구간, subcatNavAnchor 기준) ----
    const subcategoryLineChart = document.getElementById("subcategory-line-chart");
    const subcategoryLineLegend = document.getElementById("subcategory-line-legend");
    // 소분류는 대분류 색을 그대로 쓰기 때문에, 선 종류(점선 패턴)로 구분함
    const lineDashPatterns = ["none", "6,4", "2,3", "8,3,2,3", "1,2"];
    // 범례 클릭으로 껐다 켠 소분류들을 기억해둠 (이름 기준)
    let hiddenLineSubcats = {};

    function getSubcatTrendRows(tallyFn) {
      if (subcatStatsViewMode === "weekly") {
        const anchorMonday = getMonday(subcatNavAnchor);
        const rows = [];
        for (let w = 3; w >= 0; w--) {
          const weekStart = addDays(anchorMonday, -7 * w);
          const combined = {};
          for (let i = 0; i < 7; i++) {
            mergeTotals(combined, tallyFn(loadScheduleFor(addDays(weekStart, i))));
          }
          rows.push({ label: (weekStart.getMonth() + 1) + "/" + weekStart.getDate(), totals: combined });
        }
        return rows;
      }
      if (subcatStatsViewMode === "monthly") {
        const rows = [];
        for (let m = 3; m >= 0; m--) {
          const monthDate = new Date(subcatNavAnchor.getFullYear(), subcatNavAnchor.getMonth() - m, 1);
          const daysInMonth = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0).getDate();
          const combined = {};
          for (let d = 1; d <= daysInMonth; d++) {
            mergeTotals(combined, tallyFn(loadScheduleFor(new Date(monthDate.getFullYear(), monthDate.getMonth(), d))));
          }
          rows.push({ label: (monthDate.getMonth() + 1) + "월", totals: combined });
        }
        return rows;
      }
      const rows = [];
      for (let i = 6; i >= 0; i--) {
        const date = addDays(subcatNavAnchor, -i);
        rows.push({ label: (date.getMonth() + 1) + "/" + date.getDate(), totals: tallyFn(loadScheduleFor(date)) });
      }
      return rows;
    }

    function renderSubcategoryLineChart(cat) {
      subcategoryLineChart.innerHTML = "";
      subcategoryLineLegend.innerHTML = "";

      if (cat.subcategories.length === 0) return;

      const tallyFn = function (items) {
        return tallySubcategoryHours(items, cat.name);
      };
      const rows = getSubcatTrendRows(tallyFn);

      const svgNS = "http://www.w3.org/2000/svg";
      const width = 640;
      const height = 190;
      const padLeft = 30;
      const padRight = 14;
      const padTop = 14;
      const padBottom = 26;
      const plotW = width - padLeft - padRight;
      const plotH = height - padTop - padBottom;

      let maxHours = 1;
      rows.forEach(function (row) {
        cat.subcategories.forEach(function (subName) {
          const hours = row.totals[subName] || 0;
          if (hours > maxHours) maxHours = hours;
        });
      });

      function xAt(i) {
        return rows.length <= 1 ? padLeft : padLeft + (i / (rows.length - 1)) * plotW;
      }
      function yAt(hours) {
        return padTop + plotH - (hours / maxHours) * plotH;
      }

      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      svg.style.width = "100%";
      svg.style.height = "190px";

      const axis = document.createElementNS(svgNS, "line");

      cat.subcategories.forEach(function (subName, subIndex) {

        polyline.setAttribute("points", points);
        polyline.setAttribute("fill", "none");
        polyline.setAttribute("stroke", cat.color);
        polyline.setAttribute("stroke-width", "2");
        polyline.setAttribute("stroke-linejoin", "round");
        polyline.setAttribute("stroke-dasharray", lineDashPatterns[subIndex % lineDashPatterns.length]);
        svg.appendChild(polyline);

        rows.forEach(function (row, i) {
          const dot = document.createElementNS(svgNS, "circle");

      cat.subcategories.forEach(function (subName, subIndex) {

        item.style.font = "12px system-ui, sans-serif";
        item.style.color = "var(--muted)";
        item.style.cursor = "pointer";
        item.style.userSelect = "none";
        item.style.opacity = isHidden ? "0.35" : "1";

        const sampleSvg = document.createElementNS(svgNS, "svg");
        sampleSvg.setAttribute("viewBox", "0 0 24 8");
        sampleSvg.style.width = "24px";

        sampleLine.setAttribute("y1", "4");
